[package]
name = "imager"
version = "0.1.0"
edition = "2024"
authors = ["Sawang"]
description = "Build custom initramfs with OCI extensions"

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["rt"] }

# CLI parsing
clap = { workspace = true }

# OCI image handling
oci-client = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }

# Serialization
serde = { workspace = true }
serde_yaml = { workspace = true }

# Filesystem utilities
backhand = { workspace = true }
cpio = { workspace = true }
walkdir = { workspace = true }
tempfile = { workspace = true }
