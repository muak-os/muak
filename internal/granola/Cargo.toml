[package]
name = "granola"
version = "0.1.0"
edition = "2024"

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["net", "sync", "macros", "time", "signal", "fs", "io-util", "process"] }
tokio-stream = { workspace = true }

# System/platform APIs
nix = { workspace = true, features = ["process", "signal", "socket", "ioctl", "reboot"] }

# RPC and serialization
tonic = { workspace = true }
prost = { workspace = true }
tonic-prost = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Disk utilities
gptman = { workspace = true }
fatfs = { workspace = true }

# Utilities
futures-util = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Internal
kmsg = { path = "../shared/kmsg" }

[build-dependencies]
tonic-prost-build = { workspace = true }

[lints]
workspace = true
