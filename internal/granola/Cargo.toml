[package]
name = "granola"
edition.workspace = true
version.workspace = true

[dependencies]
# Asynchronous
tokio = { workspace = true, features = ["net", "sync", "macros", "time", "signal", "fs", "io-util", "process"] }
tokio-stream = { workspace = true }
futures-util = { workspace = true }

# Encoding
serde = { workspace = true }
serde_json = { workspace = true }
prost = { workspace = true }

# Cryptography
der = { workspace = true }
x509-cert = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Filesystem
gptman = { workspace = true }
fatfs = { workspace = true }

# gRPC
tonic = { workspace = true }
tonic-prost = { workspace = true }

# Internal
imager = { workspace = true }
kmsg = { workspace = true }
pki = { workspace = true }
sysconfig = { workspace = true }
yuki = { workspace = true }

# System/platform APIs
rustix = { workspace = true, features = ["process", "system", "net", "mount", "fs"] }
libc = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[lints]
workspace = true
