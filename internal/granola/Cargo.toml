[package]
name = "granola"
version = "0.1.0"
edition = "2024"

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["net", "sync", "macros", "time", "signal", "fs", "io-util", "process"] }

# System/platform APIs
nix = { workspace = true, features = ["process", "signal", "socket", "ioctl", "reboot"] }

# RPC and serialization
tonic = { workspace = true }
prost = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# Networking
rtnetlink = { workspace = true }
netlink-packet-route = { workspace = true }
netlink-packet-core = { workspace = true }
futures = { workspace = true }
dhcproto = { workspace = true }

# Utilities
bincode = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }

# Disk utilities
gptman = { workspace = true }
fatfs = { workspace = true }

# OCI image handling
oci-client = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
