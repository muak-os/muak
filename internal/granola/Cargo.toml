[package]
name = "granola"
edition.workspace = true
version.workspace = true

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["net", "sync", "macros", "time", "signal", "fs", "io-util", "process"] }
tokio-stream = { workspace = true }

# System/platform APIs
rustix = { workspace = true, features = ["process", "system", "net", "mount", "fs"] }
libc = { workspace = true }

# RPC and serialization
tonic = { workspace = true }
prost = { workspace = true }
tonic-prost = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Disk utilities
gptman = { workspace = true }
fatfs = { workspace = true }

# Utilities
futures-util = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Internal
kmsg = { path = "../shared/kmsg" }
yuki = { path = "../yuki" }
imager = { path = "../imager" }
sysconfig = { path = "../shared/sysconfig" }

[build-dependencies]
tonic-prost-build = { workspace = true }

[lints]
workspace = true
