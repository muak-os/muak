[package]
name = "apid"
version = "0.1.0"
edition.workspace = true

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["net", "sync", "macros", "time", "signal", "fs", "io-util", "rt-multi-thread"] }

# System/platform APIs
nix = { workspace = true, features = ["signal"] }

# HTTP/2 proxy
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }

# Utilities
anyhow = { workspace = true }

# Internal
kmsg = { path = "../shared/kmsg" }
notify = { path = "../shared/notify" }

[lints]
workspace = true
