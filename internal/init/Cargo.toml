[package]
name = "muak-init"
version = "0.1.0"
edition = "2024"

[dependencies]
nix = { version = "0.29", features = ["mount", "fs", "dir", "ioctl"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
