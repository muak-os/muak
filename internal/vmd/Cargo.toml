[package]
name = "vmd"
edition.workspace = true
version.workspace = true

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["net", "sync", "macros", "time", "signal", "fs", "io-util", "rt-multi-thread", "process"] }
tokio-stream = { workspace = true }

# System/platform APIs
nix = { workspace = true, features = ["process", "signal"] }

# RPC and serialization
tonic = { workspace = true }
prost = { workspace = true }
tonic-prost = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
anyhow = { workspace = true }
uuid = { workspace = true }

# Unix socket support for networkd client
tower = { workspace = true }
hyper-util = { workspace = true }

# Internal
kmsg = { path = "../shared/kmsg" }
notify = { path = "../shared/notify" }

[build-dependencies]
tonic-prost-build = { workspace = true }

[lints]
workspace = true
