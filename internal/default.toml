# Muak System Configuration
#
# This is the default configuration template.
# Generate a copy with: muakctl config generate > config.toml
# Install with:         muakctl install --endpoint <ip>:50051 --config <path> --insecure

[host]
name = "muak"
image = "ghcr.io/muak-os/installer:latest"
extensions = []
secureboot = true
port = 50051
ntp = "pool.ntp.org"

[disk]
system = ""
# data = ""

[network]
dns = [
  "9.9.9.9",
  "2620:fe::fe",
  "2620:fe::9"
]
ipv6 = true

[[network.interfaces]]
name = "br0"
type = "bridge"
ipv4.dhcp = true
ipv6.autoconf = true
bridge.port = ["auto"]

# [[network.interfaces]]
# name = "eth0"
# type = "ethernet"
# ipv4.dhcp = false
# ipv4.addresses = ["192.168.1.10/24", "192.168.1.11/24"]
# ipv4.gateway = "192.168.1.1"
# ipv6.autoconf = true

[vm]
auto_restart = true
