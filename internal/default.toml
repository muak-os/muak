# Muak System Configuration
#
# This is the default configuration template.
# Generate a copy with: muakctl config generate > config.toml
# Install with:         muakctl install --server <ip>:50051 --config config.toml

[system]
disk = ""
image = "ghcr.io/sawangg/installer:latest"
extensions = []
port = 50051

[network]
bridge = "br0"
# carrier_timeout = 6

[network.connectivity]
check_interval_secs = 60
probe_timeout_secs = 5
overall_timeout_secs = 15
