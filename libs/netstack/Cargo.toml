[package]
name = "netstack"
description = "Address-method state machines and family-neutral interface controller"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["ipv4", "ipv6"]
ipv4 = ["dep:dhcp-client"]
ipv6 = []

[dependencies]
# Asynchronous
tokio = { workspace = true, features = ["sync", "time", "rt"] }

# Error handling
thiserror = { workspace = true }

# Internal
dhcp-client = { workspace = true, optional = true }
kmsg = { workspace = true }
netdev = { workspace = true }
netlink = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
