[package]
name = "linkctl"
description = "Family-neutral per-interface address configuration controller"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["ipv4", "ipv6"]
ipv4 = ["dep:dhcp-client", "dep:packet", "packet/v4", "dep:dhcp-proto"]
ipv6 = ["dep:packet", "packet/v6", "dep:slaac"]

[dependencies]
# Asynchronous
tokio = { workspace = true, features = ["sync", "time", "rt", "net"] }

# Internal
addrconf = { workspace = true }
dhcp-client = { workspace = true, optional = true }
dhcp-proto = { workspace = true, optional = true }
netdev = { workspace = true }
netlink = { workspace = true }
packet = { workspace = true, optional = true }
slaac = { workspace = true, optional = true }

[dev-dependencies]
ip = { workspace = true, features = ["v4"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
