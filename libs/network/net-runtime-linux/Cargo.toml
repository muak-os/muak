[package]
name = "net-runtime-linux"
description = "Linux network runtime backend with optional tokio support"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["tokio"]
tokio = [
    "dep:tokio",
    "dep:netlink-sys",
    "netlink-sys/tokio_socket",
    "dep:netlink-proto",
    "dep:futures-channel",
    "dep:futures-util",
    "dep:netlink-packet-core",
    "dep:netlink-packet-route",
    "dep:netlink-linux",
    "dep:ip-method",
    "dep:packet-v4-linux",
    "dep:icmpv6-linux",
    "dep:getrandom",
    "dep:libc",
    "dep:net-runtime",
    "dep:netmodel",
]

[dependencies]
# Asynchronous
futures-channel = { version = "0.3", default-features = false, features = ["std"], optional = true }
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, features = ["net", "time", "sync", "rt"], optional = true }

# Networking
getrandom = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
netlink-packet-core = { workspace = true, optional = true }
netlink-packet-route = { workspace = true, optional = true }
netlink-proto = { workspace = true, optional = true }
netlink-sys = { workspace = true, optional = true }

# Internal
icmpv6-linux = { workspace = true, optional = true }
ip-method = { workspace = true, optional = true }
netlink-linux = { workspace = true, optional = true }
net-runtime = { workspace = true, optional = true }
netmodel = { workspace = true, optional = true }
packet-v4-linux = { workspace = true, optional = true }
