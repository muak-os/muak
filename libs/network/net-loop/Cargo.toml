[package]
name = "net-loop"
description = "Runtime-agnostic driver loop for network finite state machines"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["ipv4", "ipv6"]
ipv4 = ["iface/ipv4", "net-supervisor/ipv4"]
ipv6 = ["iface/ipv6", "net-supervisor/ipv6"]

[dependencies]
# Asynchronous
futures-util = { workspace = true, features = ["async-await"] }

# Error handling
thiserror = { workspace = true }

# Internal
iface = { workspace = true, default-features = false }
ip-method = { workspace = true }
netmodel = { workspace = true }
net-observe = { workspace = true }
net-runtime = { workspace = true }
net-supervisor = { workspace = true, default-features = false }

[dev-dependencies]
dhcp-proto = { workspace = true }
ip = { workspace = true, features = ["v4"] }
ndp = { workspace = true }
net-runtime = { workspace = true, features = ["mock"] }

[lints]
workspace = true
