[package]
name = "netmodel"
description = "No std, sans-io network domain vocabulary with an allocation-free core and configuration types behind the alloc feature"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["alloc"]
alloc = []
serde = ["dep:serde", "alloc"]

[dependencies]
# Encoding
serde = { workspace = true, optional = true, default-features = false, features = ["alloc"] }

# Error handling
thiserror = { workspace = true, default-features = false }

# Internal
mac = { workspace = true, default-features = false }

[lints]
workspace = true
