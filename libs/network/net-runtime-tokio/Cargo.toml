[package]
name = "net-runtime-tokio"
description = "Linux network runtime backend implemented with tokio"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Asynchronous
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["net", "time", "sync", "rt"] }

# Networking
getrandom = { workspace = true }
libc = { workspace = true }
netlink-packet-core = { workspace = true }
netlink-packet-route = { workspace = true }
netlink-proto = { workspace = true }
netlink-sys = { workspace = true, features = ["tokio_socket"] }

# Internal
icmpv6-linux = { workspace = true }
ip-method = { workspace = true }
netlink-linux = { workspace = true }
net-runtime = { workspace = true }
netmodel = { workspace = true }
packet-v4-linux = { workspace = true }

[lints]
workspace = true
