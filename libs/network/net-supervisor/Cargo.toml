[package]
name = "net-supervisor"
description = "Global network supervisor finite state machine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["ipv4", "ipv6"]
ipv4 = ["iface/ipv4"]
ipv6 = ["iface/ipv6"]

[dependencies]
# Internal
iface = { workspace = true, default-features = false }
ip-method = { workspace = true }
netmodel = { workspace = true }
net-observe = { workspace = true }

[dev-dependencies]
# Tests build real `iface::Snapshot` values with static, DHCP, and SLAAC views.
dhcp = { workspace = true }
ip-static = { workspace = true }
slaac = { workspace = true }
