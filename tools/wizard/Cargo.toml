[package]
name = "wizard"
description = "Deterministic image build pipeline"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "wizard"
required-features = ["cli"]

[dependencies]
# Compression
tar = { workspace = true }

# Cryptography
ring = { workspace = true }

# CLI
clap = { workspace = true, optional = true }

# Encoding
serde = { workspace = true }
toml = { workspace = true }

# Error handling
anyhow = { workspace = true, optional = true }
thiserror = { workspace = true }

# Internal
mumi = { workspace = true }
esp = { workspace = true }
koci = { workspace = true }
miso = { workspace = true}
ramune = { workspace = true }
sbolt = { workspace = true, features = ["linux"] }
yuki = { workspace = true }

[features]
default = ["cli"]
cli = ["anyhow", "clap"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
