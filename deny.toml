# Dependency policy for cargo-deny.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained, pulled in by netlink-packet-core. No safe upgrade is available.
    { id = "RUSTSEC-2024-0436", reason = "paste is transitive via netlink-packet-core and has no replacement yet" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # r-efi offers a permissive option, but also declares LGPL as an alternative.
    { allow = ["LGPL-2.1-or-later"], crate = "r-efi" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
