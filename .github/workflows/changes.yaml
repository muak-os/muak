name: Changes

on:
  workflow_call:
    inputs:
      force_all:
        description: "Build every image regardless of changes"
        required: false
        type: boolean
        default: false
    outputs:
      toolchain:
        description: "Whether the toolchain image should be rebuilt"
        value: ${{ jobs.changes.outputs.toolchain }}
      cli:
        description: "Whether the muakctl image should be rebuilt"
        value: ${{ jobs.changes.outputs.cli }}
      packages:
        description: "JSON array of package components to rebuild"
        value: ${{ jobs.changes.outputs.packages }}
      installer:
        description: "Whether the installer image should be rebuilt"
        value: ${{ jobs.changes.outputs.installer }}
      result:
        description: "Change detection result as JSON"
        value: ${{ jobs.changes.outputs.result }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      toolchain: ${{ steps.detect.outputs.toolchain }}
      cli: ${{ steps.detect.outputs.cli }}
      packages: ${{ steps.detect.outputs.packages }}
      installer: ${{ steps.detect.outputs.installer }}
      result: ${{ steps.detect.outputs.result }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Install tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-delta@0.4.0,just@1.58.0

      - name: Detect changed images
        id: detect
        shell: bash
        env:
          FORCE_ALL: ${{ inputs.force_all }}
          BASE: ${{ github.event.before }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail

          components="$(just --evaluate components | tr ' ' '\n' | sed '/^$/d' | sort -u)"

          summarize() {
            printf '%s\n' "$1"
            printf 'result=%s\n' "$1" >> "$GITHUB_OUTPUT"
            {
              printf '### Change detection\n\n'
              printf '```json\n'
              printf '%s\n' "$1" | jq .
              printf '```\n'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          }

          emit_all() {
            local packages result
            packages="$(printf '%s\n' "$components" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
            result="$(jq -cn \
              --arg base "${BASE:-}" \
              --arg sha "${GITHUB_SHA:-}" \
              --argjson packages "$packages" \
              '{base: $base, sha: $sha, forced: true, toolchain: true, cli: true, installer: true, packages: $packages, affected: []}')"
            printf 'toolchain=true\ncli=true\ninstaller=true\npackages=%s\n' "$packages" >> "$GITHUB_OUTPUT"
            summarize "$result"
          }

          # Tags, explicit requests and unusable bases rebuild everything.
          if [ "$FORCE_ALL" = true ] || [ "$IS_TAG" = true ] || [ -z "$BASE" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            emit_all
            exit 0
          fi

          # Every file inside a package directory is an input.
          # Files outside every package directory are either shared
          # inputs (trip wires, full rebuild) or handled explicitly below.
          config="$RUNNER_TEMP/cargo-delta.toml"
          cat > "$config" <<'EOF'
          [parser]
          assume = true
          assume_patterns = ["*"]

          trip_wire_patterns = [
            "Justfile",
            "rust-toolchain.toml",
            ".cargo/**",
            ".dockerignore",
            "api/**",
          ]
          EOF

          affected="$(cargo delta -c "$config" impact --base-ref "$BASE" --affected -f names)"

          # Map affected packages to images by workspace directory: the workspace
          # layout is the image layout (toolchain/, cli/, services/, init/).
          root="$(git rev-parse --show-toplevel)"
          affected_json="$(printf '%s\n' "$affected" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          dirs="$(cargo metadata --locked --no-deps --format-version 1 | jq -r \
            --arg root "$root/" --argjson affected "$affected_json" '
              .packages[]
              | select(.name as $name | $affected | index($name))
              | .manifest_path | ltrimstr($root) | split("/")[0:-1] | join("/")')"

          toolchain=false
          cli=false
          installer=false
          packages=""
          while IFS= read -r dir; do
            case "$dir" in
              toolchain/*) toolchain=true ;;
              cli) cli=true ;;
              services/* | init/*)
                component="${dir#*/}"
                if grep -qxF "$component" <<< "$components"; then
                  packages+="${component}"$'\n'
                fi
                ;;
            esac
          done <<< "$dirs"

          # Image inputs that live outside every package directory.
          git diff --quiet "$BASE"...HEAD -- toolchain/Dockerfile || toolchain=true
          git diff --quiet "$BASE"...HEAD -- Dockerfile policy || installer=true

          packages="$(printf '%s' "$packages" | jq -R -s -c 'split("\n") | map(select(length > 0)) | unique')"
          if [ "$packages" != "[]" ] || [ "$toolchain" = "true" ]; then
            installer=true
          fi

          result="$(jq -cn \
            --arg base "${BASE:-}" \
            --arg sha "${GITHUB_SHA:-}" \
            --argjson toolchain "$toolchain" \
            --argjson cli "$cli" \
            --argjson installer "$installer" \
            --argjson packages "$packages" \
            --argjson affected "$affected_json" \
            '{base: $base, sha: $sha, forced: false, toolchain: $toolchain, cli: $cli, installer: $installer, packages: $packages, affected: $affected}')"

          summarize "$result"

          printf 'toolchain=%s\ncli=%s\ninstaller=%s\npackages=%s\n' \
            "$toolchain" "$cli" "$installer" "$packages" >> "$GITHUB_OUTPUT"
