name: Build Packages

on:
  workflow_call:
    inputs:
      packages:
        description: "JSON array of packages to build"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      packages:
        description: 'JSON array of packages to build, e.g. ["granola","networkd"]'
        required: true
        type: string

jobs:
  build:
    if: inputs.packages != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    uses: ./.github/workflows/_template.yaml
    with:
      image: ${{ matrix.package }}
      image_prefix: pkgs/
      recipe: oci ${{ matrix.package }}
      arch_matrix: '["amd64","arm64"]'
