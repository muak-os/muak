name: Build Packages

on:
  push:
    branches: [master]
    paths:
      - "init/**"
      - "services/**"
      - "toolchain/**"
      - "libs/**"
      - "api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "rust-toolchain.toml"
      - ".dockerignore"
  pull_request:
    paths:
      - "init/**"
      - "services/**"
      - "toolchain/**"
      - "libs/**"
      - "api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "rust-toolchain.toml"
      - ".dockerignore"
  workflow_call:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build (leave empty for change detection, 'all' for all packages)"
        required: false
        type: string

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ steps.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-delta@0.4.0,just

      - name: Determine packages to build
        id: changes
        shell: bash
        env:
          MANUAL_PACKAGE: ${{ inputs.package }}
          EVENT_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          all="$(just --evaluate components | tr ' ' '\n' | sed '/^$/d' | sort -u)"
          packages=""

          if [ -n "${MANUAL_PACKAGE}" ]; then
            if [ "${MANUAL_PACKAGE}" = "all" ]; then
              packages="$all"
            else
              packages="${MANUAL_PACKAGE}"
            fi
          elif [ "${EVENT_TAG}" = "true" ]; then
            packages="$all"
          else
            base="${BASE_REF}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi

            if [ -z "$base" ]; then
              packages="$all"
            else
              config="${RUNNER_TEMP}/cargo-delta.toml"
              printf '%s\n' \
                'trip_wire_patterns = ["api/**", "Justfile", ".dockerignore", "rust-toolchain.toml"]' \
                '' \
                '[parser]' \
                'assume = true' \
                'assume_patterns = ["*"]' > "$config"

              affected="$(cargo delta -c "$config" impact --base-ref "$base" -f names --affected)"
              packages="$(comm -12 \
                <(printf '%s\n' "$all" | sort -u) \
                <(printf '%s\n' "$affected" | sort -u))"
            fi
          fi

          if [ -z "$packages" ]; then
            echo 'packages=[]' >> "$GITHUB_OUTPUT"
          else
            json="$(printf '%s\n' "$packages" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
            echo "packages=${json}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    uses: ./.github/workflows/_template.yaml
    with:
      image: ${{ matrix.package }}
      image_prefix: pkgs/
      recipe: oci ${{ matrix.package }}
      push: ${{ github.event_name != 'pull_request' }}
      arch_matrix: '["amd64","arm64"]'
