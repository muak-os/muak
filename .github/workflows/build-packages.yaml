name: Build Packages

on:
  workflow_call:
    inputs:
      packages:
        description: "JSON array of packages to build"
        required: true
        type: string
      toolchain:
        description: "Toolchain image reference for fresh toolchain builds"
        required: false
        type: string
        default: ""

jobs:
  build:
    if: inputs.packages != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    uses: ./.github/workflows/_template.yaml
    with:
      image: ${{ matrix.package }}
      image_prefix: pkgs/
      recipe: oci ${{ matrix.package }}
      toolchain: ${{ inputs.toolchain }}
      arch_matrix: '["amd64","arm64"]'
