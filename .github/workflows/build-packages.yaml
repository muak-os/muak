name: Build Packages

on:
  push:
    branches: [master]
    paths:
      - "pkgs/**"
      - "init/**"
      - "services/**"
      - "tools/**"
      - "libs/**"
      - "api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "rust-toolchain.toml"
      - ".dockerignore"
    tags:
      - "v[0-9]+.*"
  pull_request:
    paths:
      - "pkgs/**"
      - "init/**"
      - "services/**"
      - "tools/**"
      - "libs/**"
      - "api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "rust-toolchain.toml"
      - ".dockerignore"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build (leave empty for change detection, 'all' for all packages)"
        required: false
        type: string


jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ steps.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for manual package selection
        id: manual
        if: github.event_name == 'workflow_dispatch' && inputs.package != ''
        run: |
          if [[ "${{ inputs.package }}" == "all" ]]; then
            echo 'packages=["granola","modd","networkd","apid","workloadd","consoled","provisiond","timed","millefeuille"]' >> $GITHUB_OUTPUT
          else
            echo "packages=[\"${{ inputs.package }}\"]" >> $GITHUB_OUTPUT
          fi

      - name: Build all packages on tag push
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo 'packages=["granola","modd","networkd","apid","workloadd","consoled","provisiond","timed","millefeuille"]' >> $GITHUB_OUTPUT

      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.manual.outputs.packages == '' && steps.tag.outputs.packages == ''
        with:
          filters: |
            rebuild_all:
              - 'Justfile'
              - '.dockerignore'
            rebuild_rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            granola:
              - 'init/granola/**'
              - 'libs/kmsg/**'
              - 'libs/config/**'
              - 'libs/granola-macros/**'
            modd:
              - 'services/modd/**'
              - 'init/granola/**'
              - 'libs/kmod/**'
              - 'libs/kmsg/**'
              - 'libs/config/**'
              - 'libs/granola-macros/**'
            networkd:
              - 'services/networkd/**'
              - 'init/granola/**'
              - 'libs/kmsg/**'
              - 'libs/config/**'
              - 'libs/granola-macros/**'
              - 'libs/netlib/**'
              - 'api/internal/network.proto'
            apid:
              - 'services/apid/**'
              - 'init/granola/**'
              - 'libs/kmsg/**'
              - 'libs/config/**'
              - 'libs/pki/**'
              - 'libs/granola-macros/**'
              - 'api/*.proto'
              - 'api/internal/network.proto'
            workloadd:
              - 'services/workloadd/**'
              - 'init/granola/**'
              - 'libs/kmsg/**'
              - 'libs/config/**'
              - 'libs/btrfs/**'
              - 'libs/granola-macros/**'
              - 'libs/netlib/**'
              - 'api/internal/network.proto'
            consoled:
              - 'services/consoled/**'
              - 'init/granola/**'
              - 'libs/kmsg/**'
              - 'libs/config/**'
              - 'libs/granola-macros/**'
            provisiond:
              - 'services/provisiond/**'
              - 'init/granola/**'
              - 'libs/kmsg/**'
              - 'libs/config/**'
              - 'libs/pki/**'
              - 'libs/btrfs/**'
              - 'libs/luks2/**'
              - 'libs/tpm2/**'
              - 'libs/erofs/**'
              - 'libs/esp/**'
              - 'libs/fatfs/**'
              - 'libs/granola-macros/**'
              - 'libs/parttable/**'
              - 'libs/uki/**'
              - 'tools/koci/**'
              - 'tools/miso/**'
              - 'tools/mumi/**'
              - 'tools/ramune/**'
              - 'tools/sbolt/**'
              - 'tools/wizard/**'
              - 'tools/yuki/**'
            timed:
              - 'services/timed/**'
              - 'init/granola/**'
              - 'libs/kmsg/**'
              - 'libs/config/**'
              - 'libs/granola-macros/**'
            millefeuille:
              - 'init/millefeuille/**'
              - 'libs/kmsg/**'
              - 'libs/kmod/**'
              - 'libs/btrfs/**'
              - 'libs/luks2/**'
              - 'libs/tpm2/**'

      - name: Determine packages to build
        id: changes
        env:
          MANUAL_PACKAGES: ${{ steps.manual.outputs.packages }}
          TAG_PACKAGES: ${{ steps.tag.outputs.packages }}
          REBUILD_ALL: ${{ steps.filter.outputs.rebuild_all }}
          REBUILD_RUST: ${{ steps.filter.outputs.rebuild_rust }}
          FILTER_CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          if [[ -n "${MANUAL_PACKAGES}" ]]; then
            echo "packages=${MANUAL_PACKAGES}" >> $GITHUB_OUTPUT
          elif [[ -n "${TAG_PACKAGES}" ]]; then
            echo "packages=${TAG_PACKAGES}" >> $GITHUB_OUTPUT
          elif [[ "${REBUILD_ALL}" == "true" ]]; then
            echo 'packages=["granola","modd","networkd","apid","workloadd","consoled","provisiond","timed","millefeuille"]' >> $GITHUB_OUTPUT
          elif [[ "${REBUILD_RUST}" == "true" ]]; then
            echo 'packages=["granola","modd","networkd","apid","workloadd","consoled","provisiond","timed","millefeuille"]' >> $GITHUB_OUTPUT
          elif [[ -n "${FILTER_CHANGES}" && "${FILTER_CHANGES}" != "[]" ]]; then
            echo "packages=${FILTER_CHANGES}" >> $GITHUB_OUTPUT
          else
            echo "packages=[]" >> $GITHUB_OUTPUT
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    uses: ./.github/workflows/_template.yaml
    with:
      image: ${{ matrix.package }}
      image_prefix: pkgs/
      recipe: oci ${{ matrix.package }}
      push: ${{ github.event_name != 'pull_request' }}
      latest: ${{ startsWith(github.ref, 'refs/tags/') }}
      arch_matrix: '["amd64","arm64"]'
