name: Build Packages

on:
  push:
    branches: [master]
    paths:
      - "pkgs/**"
      - "internal/**"
      - "api/**"
    tags:
      - "v[0-9]+.*"
  pull_request:
    paths:
      - "pkgs/**"
      - "internal/**"
      - "api/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build (leave empty for change detection, 'all' for all packages)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ steps.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for manual package selection
        id: manual
        if: github.event_name == 'workflow_dispatch' && inputs.package != ''
        run: |
          if [[ "${{ inputs.package }}" == "all" ]]; then
            echo 'packages=["granola","modd","networkd","apid","vmd","init","stub","cloud-hypervisor","firecracker","qemu"]' >> $GITHUB_OUTPUT
          else
            echo "packages=[\"${{ inputs.package }}\"]" >> $GITHUB_OUTPUT
          fi

      - name: Build all packages on tag push
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo 'packages=["granola","modd","networkd","apid","vmd","init","stub","cloud-hypervisor","firecracker","qemu"]' >> $GITHUB_OUTPUT

      - name: Check for Cargo changes (rebuild all Rust packages)
        id: cargo
        if: steps.manual.outputs.packages == '' && steps.tag.outputs.packages == ''
        run: |
          if git diff --name-only HEAD^..HEAD 2>/dev/null | grep -qE '^Cargo\.(toml|lock)$'; then
            echo "rebuild-all=true" >> $GITHUB_OUTPUT
          else
            echo "rebuild-all=false" >> $GITHUB_OUTPUT
          fi

      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.manual.outputs.packages == '' && steps.tag.outputs.packages == '' && steps.cargo.outputs.rebuild-all != 'true'
        with:
          filters: |
            granola:
              - 'pkgs/granola/**'
              - 'internal/granola/**'
              - 'api/**'
            modd:
              - 'pkgs/modd/**'
              - 'internal/modd/**'
              - 'internal/shared/kmod/**'
              - 'internal/shared/kmsg/**'
              - 'internal/shared/notify/**'
            networkd:
              - 'pkgs/networkd/**'
              - 'internal/networkd/**'
              - 'internal/shared/notify/**'
              - 'api/internal/network.proto'
            apid:
              - 'pkgs/apid/**'
              - 'internal/apid/**'
              - 'internal/shared/notify/**'
              - 'api/*.proto'
              - 'api/internal/network.proto'
            vmd:
              - 'pkgs/vmd/**'
              - 'internal/vmd/**'
              - 'internal/shared/notify/**'
              - 'api/internal/vm.proto'
              - 'api/internal/network.proto'
            init:
              - 'pkgs/init/**'
              - 'internal/init/**'
            stub:
              - 'pkgs/stub/**'
              - 'internal/stub/**'
            cloud-hypervisor:
              - 'pkgs/cloud-hypervisor/**'
            firecracker:
              - 'pkgs/firecracker/**'
            qemu:
              - 'pkgs/qemu/**'

      - name: Determine packages to build
        id: changes
        env:
          MANUAL_PACKAGES: ${{ steps.manual.outputs.packages }}
          TAG_PACKAGES: ${{ steps.tag.outputs.packages }}
          REBUILD_ALL: ${{ steps.cargo.outputs.rebuild-all }}
          FILTER_CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          if [[ -n "${MANUAL_PACKAGES}" ]]; then
            echo "packages=${MANUAL_PACKAGES}" >> $GITHUB_OUTPUT
          elif [[ -n "${TAG_PACKAGES}" ]]; then
            echo "packages=${TAG_PACKAGES}" >> $GITHUB_OUTPUT
          elif [[ "${REBUILD_ALL}" == "true" ]]; then
            echo 'packages=["granola","modd","networkd","apid","vmd","init","stub"]' >> $GITHUB_OUTPUT
          elif [[ -n "${FILTER_CHANGES}" && "${FILTER_CHANGES}" != "[]" ]]; then
            echo "packages=${FILTER_CHANGES}" >> $GITHUB_OUTPUT
          else
            echo "packages=[]" >> $GITHUB_OUTPUT
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3
        id: buildx

      - uses: taiki-e/install-action@just

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.package }} (${{ matrix.arch }})
        run: |
          CACHE_ARGS="--cache-from=type=registry,ref=${{ env.REGISTRY }}/sawangg/pkgs/${{ matrix.package }}:buildcache-${{ matrix.arch }}"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            CACHE_ARGS="${CACHE_ARGS} --cache-to=type=registry,ref=${{ env.REGISTRY }}/sawangg/pkgs/${{ matrix.package }}:buildcache-${{ matrix.arch }},mode=max"
          fi
          CONTAINER_RUNTIME=docker \
          PUSH=${{ github.event_name != 'pull_request' }} \
          LATEST=${{ startsWith(github.ref, 'refs/tags/') }} \
          REGISTRY=${{ env.REGISTRY }}/sawangg \
          CI_ARGS="--builder=${{ steps.buildx.outputs.name }} ${CACHE_ARGS}" \
          just oci ${{ matrix.package }}

      - name: Build summary
        if: github.event_name != 'pull_request'
        run: |
          TAG=$(git describe --tag --always --dirty --match v[0-9]* 2>/dev/null || echo dev)
          echo "### ${{ matrix.package }} (${{ matrix.arch }}) Built :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/sawangg/pkgs/${{ matrix.package }}:${TAG}\`" >> $GITHUB_STEP_SUMMARY
