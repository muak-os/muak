name: Build Packages

on:
  push:
    branches: [master]
    paths:
      - "pkgs/**"
      - "core/**"
      - "services/**"
      - "tools/**"
      - "libs/**"
      - "api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "rust-toolchain.toml"
      - ".dockerignore"
    tags:
      - "v[0-9]+.*"
  pull_request:
    paths:
      - "pkgs/**"
      - "core/**"
      - "services/**"
      - "tools/**"
      - "libs/**"
      - "api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "rust-toolchain.toml"
      - ".dockerignore"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build (leave empty for change detection, 'all' for all packages)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io/muak-os

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ steps.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for manual package selection
        id: manual
        if: github.event_name == 'workflow_dispatch' && inputs.package != ''
        run: |
          if [[ "${{ inputs.package }}" == "all" ]]; then
            echo 'packages=["granola","modd","networkd","apid","workloadd","consoled","provisiond","timed","millefeuille"]' >> $GITHUB_OUTPUT
          else
            echo "packages=[\"${{ inputs.package }}\"]" >> $GITHUB_OUTPUT
          fi

      - name: Build all packages on tag push
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo 'packages=["granola","modd","networkd","apid","workloadd","consoled","provisiond","timed","millefeuille"]' >> $GITHUB_OUTPUT

      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.manual.outputs.packages == '' && steps.tag.outputs.packages == ''
        with:
          filters: |
            rebuild_all:
              - 'Justfile'
              - '.dockerignore'
            rebuild_rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            granola:
              - 'core/granola/**'
              - 'libs/kmsg/**'
              - 'libs/config/**'
              - 'libs/granola-macros/**'
            modd:
              - 'services/modd/**'
              - 'core/granola/**'
              - 'libs/kmod/**'
              - 'libs/kmsg/**'
              - 'libs/config/**'
              - 'libs/granola-macros/**'
            networkd:
              - 'services/networkd/**'
              - 'core/granola/**'
              - 'libs/kmsg/**'
              - 'libs/config/**'
              - 'libs/granola-macros/**'
              - 'libs/netlib/**'
              - 'api/internal/network.proto'
            apid:
              - 'services/apid/**'
              - 'core/granola/**'
              - 'libs/kmsg/**'
              - 'libs/config/**'
              - 'libs/pki/**'
              - 'libs/granola-macros/**'
              - 'api/*.proto'
              - 'api/internal/network.proto'
            workloadd:
              - 'services/workloadd/**'
              - 'core/granola/**'
              - 'libs/kmsg/**'
              - 'libs/config/**'
              - 'libs/btrfs/**'
              - 'libs/granola-macros/**'
              - 'libs/netlib/**'
              - 'api/internal/network.proto'
            consoled:
              - 'services/consoled/**'
              - 'core/granola/**'
              - 'libs/kmsg/**'
              - 'libs/config/**'
              - 'libs/granola-macros/**'
            provisiond:
              - 'services/provisiond/**'
              - 'core/granola/**'
              - 'libs/kmsg/**'
              - 'libs/config/**'
              - 'libs/pki/**'
              - 'libs/btrfs/**'
              - 'libs/luks2/**'
              - 'libs/tpm2/**'
              - 'libs/erofs/**'
              - 'libs/esp/**'
              - 'libs/fatfs/**'
              - 'libs/granola-macros/**'
              - 'libs/parttable/**'
              - 'libs/uki/**'
              - 'tools/koci/**'
              - 'tools/miso/**'
              - 'tools/mumi/**'
              - 'tools/ramune/**'
              - 'tools/sbolt/**'
              - 'tools/wizard/**'
              - 'tools/yuki/**'
            timed:
              - 'services/timed/**'
              - 'core/granola/**'
              - 'libs/kmsg/**'
              - 'libs/config/**'
              - 'libs/granola-macros/**'
            millefeuille:
              - 'core/millefeuille/**'
              - 'libs/kmsg/**'
              - 'libs/kmod/**'
              - 'libs/btrfs/**'
              - 'libs/luks2/**'
              - 'libs/tpm2/**'

      - name: Determine packages to build
        id: changes
        env:
          MANUAL_PACKAGES: ${{ steps.manual.outputs.packages }}
          TAG_PACKAGES: ${{ steps.tag.outputs.packages }}
          REBUILD_ALL: ${{ steps.filter.outputs.rebuild_all }}
          REBUILD_RUST: ${{ steps.filter.outputs.rebuild_rust }}
          FILTER_CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          if [[ -n "${MANUAL_PACKAGES}" ]]; then
            echo "packages=${MANUAL_PACKAGES}" >> $GITHUB_OUTPUT
          elif [[ -n "${TAG_PACKAGES}" ]]; then
            echo "packages=${TAG_PACKAGES}" >> $GITHUB_OUTPUT
          elif [[ "${REBUILD_ALL}" == "true" ]]; then
            echo 'packages=["granola","modd","networkd","apid","workloadd","consoled","provisiond","timed","millefeuille"]' >> $GITHUB_OUTPUT
          elif [[ "${REBUILD_RUST}" == "true" ]]; then
            echo 'packages=["granola","modd","networkd","apid","workloadd","consoled","provisiond","timed","millefeuille"]' >> $GITHUB_OUTPUT
          elif [[ -n "${FILTER_CHANGES}" && "${FILTER_CHANGES}" != "[]" ]]; then
            echo "packages=${FILTER_CHANGES}" >> $GITHUB_OUTPUT
          else
            echo "packages=[]" >> $GITHUB_OUTPUT
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4
        id: buildx

      - uses: taiki-e/install-action@just

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.package }} (${{ matrix.arch }})
        run: |
          # Caching (registry-only) and push/tag logic live in the Justfile.
          CONTAINER_RUNTIME=docker \
          ARCH=${{ matrix.arch }} \
          PUSH=${{ github.event_name != 'pull_request' }} \
          LATEST=${{ startsWith(github.ref, 'refs/tags/') }} \
          just oci ${{ matrix.package }}

      - name: Build summary
        if: github.event_name != 'pull_request'
        run: |
          TAG=$(git describe --tag --always --dirty --match v[0-9]* 2>/dev/null || echo dev)
          echo "### ${{ matrix.package }} (${{ matrix.arch }}) Built" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/pkgs/${{ matrix.package }}:${TAG}\`" >> $GITHUB_STEP_SUMMARY
