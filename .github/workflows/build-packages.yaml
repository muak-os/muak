name: Build Packages

on:
  push:
    branches: [master]
    paths:
      - "pkgs/**"
      - "internal/**"
      - "api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-packages.yaml"
  pull_request:
    paths:
      - "pkgs/**"
      - "internal/**"
      - "api/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build (leave empty for change detection)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for manual package selection
        id: manual
        if: github.event_name == 'workflow_dispatch' && inputs.package != ''
        run: echo "packages=[\"${{ inputs.package }}\"]" >> $GITHUB_OUTPUT

      - name: Check for Cargo changes (rebuild all Rust packages)
        id: cargo
        if: steps.manual.outputs.packages == ''
        run: |
          if git diff --name-only HEAD^..HEAD 2>/dev/null | grep -qE '^Cargo\.(toml|lock)$'; then
            echo "rebuild-all=true" >> $GITHUB_OUTPUT
          else
            echo "rebuild-all=false" >> $GITHUB_OUTPUT
          fi

      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.manual.outputs.packages == '' && steps.cargo.outputs.rebuild-all != 'true'
        with:
          filters: |
            granola:
              - 'pkgs/granola/**'
              - 'internal/granola/**'
              - 'api/**'
            init:
              - 'pkgs/init/**'
              - 'internal/init/**'
            imager:
              - 'pkgs/imager/**'
              - 'internal/imager/**'
            yuki:
              - 'pkgs/yuki/**'
              - 'internal/yuki/**'
            stub:
              - 'pkgs/stub/**'
              - 'internal/stub/**'
            cloud-hypervisor:
              - 'pkgs/cloud-hypervisor/**'
            firecracker:
              - 'pkgs/firecracker/**'
            qemu:
              - 'pkgs/qemu/**'

      - name: Determine packages to build
        id: changes
        run: |
          if [[ -n "${{ steps.manual.outputs.packages }}" ]]; then
            echo "packages=${{ steps.manual.outputs.packages }}" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.cargo.outputs.rebuild-all }}" == "true" ]]; then
            echo 'packages=["granola","init","imager","yuki","stub"]' >> $GITHUB_OUTPUT
          elif [[ -n "${{ steps.filter.outputs.changes }}" && "${{ steps.filter.outputs.changes }}" != "[]" ]]; then
            echo "packages=${{ steps.filter.outputs.changes }}" >> $GITHUB_OUTPUT
          else
            echo "packages=[]" >> $GITHUB_OUTPUT
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.package }}
        run: |
          make oci-${{ matrix.package }} \
            PUSH=${{ github.event_name != 'pull_request' }} \
            REGISTRY=${{ env.REGISTRY }}/sawangg \
            CI_ARGS="--cache-from=type=gha,scope=${{ matrix.package }} --cache-to=type=gha,mode=max,scope=${{ matrix.package }}"

      - name: Build summary
        if: github.event_name != 'pull_request'
        run: |
          TAG=$(git describe --tag --always --dirty --match v[0-9]* 2>/dev/null || echo dev)
          echo "### ${{ matrix.package }} Built :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/sawangg/pkgs/${{ matrix.package }}:${TAG}\`" >> $GITHUB_STEP_SUMMARY
