name: Build Packages

on:
  push:
    branches:
      - master
    paths:
      - "pkgs/**"
      - "internal/**"
      - "api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-packages.yaml"
  pull_request:
    paths:
      - "pkgs/**"
      - "internal/**"
      - "api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-packages.yaml"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build (leave empty to build all)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
      build-all: ${{ steps.check-all.outputs.build-all }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if we should build all packages
        id: check-all
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -z "${{ inputs.package }}" ]]; then
            echo "build-all=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" ]] && git diff --name-only HEAD^..HEAD | grep -qE '^(Cargo\.toml|Cargo\.lock)$'; then
            echo "build-all=true" >> $GITHUB_OUTPUT
          else
            echo "build-all=false" >> $GITHUB_OUTPUT
          fi

      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.check-all.outputs.build-all == 'false'
        with:
          filters: |
            granola:
              - 'pkgs/granola/**'
              - 'internal/granola/**'
              - 'api/**'
            init:
              - 'pkgs/init/**'
              - 'internal/init/**'
            imager:
              - 'pkgs/imager/**'
              - 'internal/imager/**'
            yuki:
              - 'pkgs/yuki/**'
              - 'internal/yuki/**'
            stub:
              - 'pkgs/stub/**'
              - 'internal/stub/**'
            kernel:
              - 'pkgs/kernel/**'
            cloud-hypervisor:
              - 'pkgs/cloud-hypervisor/**'
            firecracker:
              - 'pkgs/firecracker/**'
            qemu:
              - 'pkgs/qemu/**'

  build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.build-all == 'true' || needs.detect-changes.outputs.packages != '[]' || github.event.inputs.package != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ github.event_name == 'workflow_dispatch' && inputs.package != '' && fromJSON(format('["{0}"]', inputs.package)) || needs.detect-changes.outputs.build-all == 'true' && fromJSON('["granola", "init", "imager", "yuki", "stub", "kernel", "cloud-hypervisor", "firecracker", "qemu"]') || fromJSON(needs.detect-changes.outputs.packages) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/sawangg/pkgs/${{ matrix.package }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-
            type=ref,event=pr

      - name: Build and push package
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: pkgs/${{ matrix.package }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}
          provenance: false

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/sawangg/pkgs/${{ matrix.package }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
