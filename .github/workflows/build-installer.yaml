name: Build Installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (defaults to current commit)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io/muak-os

jobs:
  build-installer:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4
        id: buildx

      - uses: taiki-e/install-action@just

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(git describe --tag --always --match v[0-9]* 2>/dev/null || echo dev)" >> $GITHUB_OUTPUT
          fi

      - name: Build installer (${{ matrix.arch }})
        run: |
          CONTAINER_RUNTIME=docker \
          PUSH=true \
          LATEST=true \
          TAG=${{ steps.tag.outputs.tag }} \
          CI_ARGS="--builder=${{ steps.buildx.outputs.name }} --cache-from=type=registry,ref=${{ env.REGISTRY }}/installer:buildcache-${{ matrix.arch }} --cache-to=type=registry,ref=${{ env.REGISTRY }}/installer:buildcache-${{ matrix.arch }},mode=max" \
          just oci installer

      - name: Setup cosign key
        run: |
          echo "${{ secrets.COSIGN_KEY }}" > cosign.key
          chmod 600 cosign.key

      - name: Sign installer (${{ matrix.arch }})
        run: |
          TAG=${{ steps.tag.outputs.tag }} \
          just sign

      - name: Cleanup cosign key
        if: always()
        run: rm -f cosign.key

      - name: Build summary
        run: |
          echo "### Installer (${{ matrix.arch }}) Built :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/installer:${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
