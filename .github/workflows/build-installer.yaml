name: Build Installer

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Toolchain image reference for fresh toolchain builds"
        required: false
        type: string
        default: ""

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_template.yaml
    with:
      image: installer
      recipe: oci installer
      toolchain: ${{ inputs.toolchain }}
      sign: true
    secrets:
      COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
