name: Build Installer

on:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - ".github/workflows/build-installer.yaml"
  workflow_run:
    workflows: ["Build Packages", "Build Kernel"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-installer:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer
        run: |
          make oci-installer \
            PUSH=${{ github.event_name != 'pull_request' }} \
            REGISTRY=${{ env.REGISTRY }}/sawangg \
            CI_ARGS="--cache-from=type=registry,ref=${{ env.REGISTRY }}/sawangg/installer:buildcache --cache-to=type=registry,ref=${{ env.REGISTRY }}/sawangg/installer:buildcache,mode=max"

      - name: Build summary
        if: github.event_name != 'pull_request'
        run: |
          TAG=$(git describe --tag --always --dirty --match v[0-9]* 2>/dev/null || echo dev)
          echo "### Installer Built :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/sawangg/installer:${TAG}\`" >> $GITHUB_STEP_SUMMARY
