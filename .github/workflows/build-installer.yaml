name: Build Installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (defaults to current commit)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-installer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(git describe --tag --always --match v[0-9]* 2>/dev/null || echo dev)" >> $GITHUB_OUTPUT
          fi

      - name: Build installer
        run: |
          make oci-installer \
            CONTAINER_RUNTIME=docker \
            PUSH=true \
            TAG=${{ steps.tag.outputs.tag }} \
            REGISTRY=${{ env.REGISTRY }}/sawangg \
            CI_ARGS="--cache-from=type=registry,ref=${{ env.REGISTRY }}/sawangg/installer:buildcache --cache-to=type=registry,ref=${{ env.REGISTRY }}/sawangg/installer:buildcache,mode=max"

      - name: Build summary
        run: |
          echo "### Installer Built :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/sawangg/installer:${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
