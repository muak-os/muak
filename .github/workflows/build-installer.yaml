name: Build Installer

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        type: string
        default: ""
      tag:
        description: "Final image tag"
        required: true
        type: string
      toolchain:
        description: "Toolchain image reference for fresh toolchain builds"
        required: false
        type: string
        default: ""
    secrets:
      COSIGN_KEY:
        description: "Installer signing key"
        required: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_template.yaml
    with:
      image: installer
      ref: ${{ inputs.ref }}
      tag: ${{ inputs.tag }}
      recipe: oci installer
      toolchain: ${{ inputs.toolchain }}
      sign: true
    secrets:
      COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
