name: Build CLI

on:
  push:
    branches: [master]
    paths:
      - "pkgs/muakctl/**"
      - "cli/**"
      - "internal/shared/pki/**"
      - "internal/shared/sysconfig/**"
      - "api/*.proto"
    tags:
      - "v[0-9]+.*"
  pull_request:
    paths:
      - "pkgs/muakctl/**"
      - "cli/**"
      - "internal/shared/pki/**"
      - "internal/shared/sysconfig/**"
      - "api/*.proto"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-cli:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3
        id: buildx

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cli (${{ matrix.arch }})
        run: |
          CACHE_ARGS="--cache-from=type=registry,ref=${{ env.REGISTRY }}/sawangg/muakctl:buildcache-${{ matrix.arch }}"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            CACHE_ARGS="${CACHE_ARGS} --cache-to=type=registry,ref=${{ env.REGISTRY }}/sawangg/muakctl:buildcache-${{ matrix.arch }},mode=max"
          fi
          make oci cli \
            CONTAINER_RUNTIME=docker \
            PUSH=${{ github.event_name != 'pull_request' }} \
            LATEST=${{ startsWith(github.ref, 'refs/tags/') }} \
            REGISTRY=${{ env.REGISTRY }}/sawangg \
            CI_ARGS="--builder=${{ steps.buildx.outputs.name }} ${CACHE_ARGS}"

      - name: Build summary
        if: github.event_name != 'pull_request'
        run: |
          TAG=$(git describe --tag --always --dirty --match v[0-9]* 2>/dev/null || echo dev)
          echo "### muakctl (${{ matrix.arch }}) Built :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/sawangg/muakctl:${TAG}\`" >> $GITHUB_STEP_SUMMARY
