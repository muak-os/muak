name: Build CLI

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Toolchain image reference for fresh toolchain builds"
        required: false
        type: string
        default: ""

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_template.yaml
    with:
      image: muakctl
      recipe: oci cli
      toolchain: ${{ inputs.toolchain }}
