name: Build CLI

on:
  push:
    branches: [master]
    paths:
      - "cli/**"
      - "libs/pki/**"
      - "libs/config/**"
      - "api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "rust-toolchain.toml"
      - ".dockerignore"
  pull_request:
    paths:
      - "cli/**"
      - "libs/pki/**"
      - "libs/config/**"
      - "api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "rust-toolchain.toml"
      - ".dockerignore"
  workflow_call:
    inputs:
      latest:
        required: false
        type: boolean
        default: false
      tag:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      latest:
        description: "Tag the image as latest"
        required: false
        type: boolean
        default: true
      tag:
        description: "Tag to build (defaults to current commit)"
        required: false
        type: string

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_template.yaml
    with:
      image: muakctl
      recipe: oci cli
      push: ${{ github.event_name != 'pull_request' }}
      latest: ${{ startsWith(github.ref, 'refs/tags/') || inputs.latest }}
      tag: ${{ inputs.tag }}
