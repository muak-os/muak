name: Build Toolchain

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        type: string
        default: ""
      tag:
        description: "Final toolchain tag"
        required: true
        type: string
    outputs:
      ref:
        description: "Resolved toolchain reference"
        value: ${{ jobs.build.outputs.ref }}

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_template.yaml
    with:
      image: toolchain
      ref: ${{ inputs.ref }}
      tag: ${{ inputs.tag }}
      recipe: oci toolchain
      arch_matrix: '["amd64","arm64"]'
