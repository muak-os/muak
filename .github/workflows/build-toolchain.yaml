name: Build Toolchain

on:
  workflow_call:
    outputs:
      tag:
        description: "Resolved toolchain tag"
        value: ${{ jobs.build.outputs.tag }}
      repository:
        description: "Resolved toolchain repository"
        value: ${{ jobs.build.outputs.repository }}
      ref:
        description: "Resolved toolchain reference"
        value: ${{ jobs.build.outputs.ref }}

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_template.yaml
    with:
      image: toolchain
      recipe: oci toolchain
      arch_matrix: '["amd64","arm64"]'
