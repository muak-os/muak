name: Build Toolchain

on:
  push:
    branches: [master]
    paths:
      - "toolchain/miso/**"
      - "toolchain/kata/**"
      - "toolchain/koci/**"
      - "toolchain/mumi/**"
      - "toolchain/ramune/**"
      - "toolchain/sbolt/**"
      - "toolchain/wizard/**"
      - "toolchain/yuki/**"
      - "libs/disk/**"
      - "libs/erofs/**"
      - "libs/esp/**"
      - "libs/oci/**"
      - "libs/oci-client/**"
      - "libs/parttable/**"
      - "libs/uki/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "rust-toolchain.toml"
      - ".dockerignore"
  pull_request:
    paths:
      - "toolchain/miso/**"
      - "toolchain/kata/**"
      - "toolchain/koci/**"
      - "toolchain/mumi/**"
      - "toolchain/ramune/**"
      - "toolchain/sbolt/**"
      - "toolchain/wizard/**"
      - "toolchain/yuki/**"
      - "libs/disk/**"
      - "libs/erofs/**"
      - "libs/esp/**"
      - "libs/oci/**"
      - "libs/oci-client/**"
      - "libs/parttable/**"
      - "libs/uki/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "rust-toolchain.toml"
      - ".dockerignore"
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (defaults to current commit)"
        required: false
        type: string

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_template.yaml
    with:
      image: toolchain
      recipe: oci toolchain
      push: ${{ github.event_name != 'pull_request' }}
      tag: ${{ inputs.tag }}
      arch_matrix: '["amd64","arm64"]'
