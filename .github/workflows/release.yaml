name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (defaults to current commit)"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  toolchain:
    needs: ci
    uses: ./.github/workflows/build-toolchain.yaml
    with:
      tag: ${{ inputs.tag || '' }}
    secrets: inherit

  packages:
    needs: toolchain
    uses: ./.github/workflows/build-packages.yaml
    secrets: inherit

  cli:
    needs: toolchain
    uses: ./.github/workflows/build-cli.yaml
    with:
      tag: ${{ inputs.tag || '' }}
    secrets: inherit

  installer:
    needs: [packages, cli]
    uses: ./.github/workflows/build-installer.yaml
    with:
      tag: ${{ inputs.tag || '' }}
    secrets: inherit
