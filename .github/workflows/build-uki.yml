---
name: Build UKI

on:
  push:
  pull_request:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - uses: actions/checkout@v5

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc wget

      - name: Build kernel
        run: |
          ARCH=${{ matrix.arch }} bash scripts/build-kernel.sh

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}
          path: |
            output/${{ matrix.arch }}/vmlinuz-*

      - name: Upload kernel build tree
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/linux-*

  build-initramfs:
    needs: build-kernel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - uses: actions/checkout@v5

      - name: Download kernel build tree
        uses: actions/download-artifact@v4
        with:
          name: kernel-build-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/

      - name: Install mkinitcpio
        run: |
          sudo apt-get update
          sudo apt-get install -y mkinitcpio

      - name: Build initramfs with mkinitcpio
        run: |
          ARCH=${{ matrix.arch }} bash scripts/build-initramfs.sh

      - name: Upload initramfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-${{ matrix.arch }}
          path: output/${{ matrix.arch }}/initramfs.img

  build-uki:
    needs: [build-initramfs, build-kernel]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - uses: actions/checkout@v5

      - name: Install UKI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y systemd-ukify

      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}
          path: output/${{ matrix.arch }}/

      - name: Download initramfs artifact
        uses: actions/download-artifact@v4
        with:
          name: initramfs-${{ matrix.arch }}
          path: output/${{ matrix.arch }}/

      - name: Build UKI
        run: |
          ARCH=${{ matrix.arch }} bash scripts/build-uki.sh

      - name: Upload UKI artifact
        uses: actions/upload-artifact@v4
        with:
          name: uki-${{ matrix.arch }}
          path: output/${{ matrix.arch }}/muak-*.efi
