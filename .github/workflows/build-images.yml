---
name: Build images

on:
  push:
  pull_request:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - uses: actions/checkout@v5

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc wget

      - name: Build kernel
        run: |
          ARCH=${{ matrix.arch }} bash scripts/build-kernel.sh

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}
          path: |
            output/${{ matrix.arch }}/vmlinuz-*

      - name: Upload kernel build tree
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/linux-*

  build-initramfs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Install initramfs build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio zstd squashfs-tools

      - name: Build initramfs
        run: |
          bash scripts/build-initramfs.sh ${{ matrix.arch }}

      - name: Upload initramfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-${{ matrix.arch }}
          path: build/initramfs.img

  build-uki:
    needs: [build-kernel, build-initramfs]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - uses: actions/checkout@v5

      - name: Install UKI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y systemd-ukify python3

      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-build-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/

      - name: Download initramfs artifact
        uses: actions/download-artifact@v4
        with:
          name: initramfs-${{ matrix.arch }}
          path: build/

      - name: Restore kernel build tree structure
        run: |
          cd build/${{ matrix.arch }}
          KERNEL_DIR=$(ls -d linux-* 2>/dev/null | head -1)
          if [ -n "$KERNEL_DIR" ]; then
            echo "Found kernel directory: $KERNEL_DIR"
            ls -la "$KERNEL_DIR/arch/x86/boot/" || echo "bzImage not found in expected location"
          else
            echo "ERROR: No kernel directory found"
            exit 1
          fi

      - name: Build UKI
        run: |
          ARCH=${{ matrix.arch }} bash scripts/build-uki.sh

      - name: Upload UKI artifact
        uses: actions/upload-artifact@v4
        with:
          name: uki-${{ matrix.arch }}
          path: output/${{ matrix.arch }}/muak-*.efi

  build-iso:
    needs: build-uki
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - uses: actions/checkout@v5

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools

      - name: Download UKI artifact
        uses: actions/download-artifact@v4
        with:
          name: uki-${{ matrix.arch }}
          path: output/${{ matrix.arch }}/

      - name: Build ISO
        run: |
          ARCH=${{ matrix.arch }} bash scripts/build-iso.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.arch }}
          path: output/${{ matrix.arch }}/muak-*.iso
