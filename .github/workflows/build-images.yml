---
name: Build images

on:
  push:
  pull_request:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - uses: actions/checkout@v5

      - name: Get kernel version
        id: kernel-version
        run: |
          KERNEL_VERSION=$(grep 'KERNEL_VERSION=' scripts/build-kernel.sh | grep -oP ':-\K[^}]+')
          echo "version=${KERNEL_VERSION}" >> $GITHUB_OUTPUT
          echo "Kernel version: ${KERNEL_VERSION}"

      - name: Calculate config hash
        id: config-hash
        run: |
          CONFIG_HASH=$(sha256sum config/kernel/${{ matrix.arch }}/kernel.config | cut -d' ' -f1 | cut -c1-8)
          echo "hash=${CONFIG_HASH}" >> $GITHUB_OUTPUT
          echo "Config hash: ${CONFIG_HASH}"

      - name: Cache kernel source tarball
        uses: actions/cache@v4
        with:
          path: build/kernel/${{ matrix.arch }}/linux-${{ steps.kernel-version.outputs.version }}.tar.xz
          key: kernel-source-${{ steps.kernel-version.outputs.version }}
          restore-keys: |
            kernel-source-

      - name: Cache kernel build
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: |
            build/kernel/${{ matrix.arch }}/linux-${{ steps.kernel-version.outputs.version }}
          key: kernel-build-${{ matrix.arch }}-${{ steps.kernel-version.outputs.version }}-${{ steps.config-hash.outputs.hash }}
          restore-keys: |
            kernel-build-${{ matrix.arch }}-${{ steps.kernel-version.outputs.version }}-

      - name: Install kernel build dependencies
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc wget

      - name: Build kernel
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          ARCH=${{ matrix.arch }} bash scripts/build-kernel.sh

      - name: Upload kernel build tree
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ matrix.arch }}
          path: build/kernel/${{ matrix.arch }}/linux-*

  build-initramfs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Install initramfs build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio zstd squashfs-tools protobuf-compiler

      - name: Build initramfs
        run: |
          bash scripts/build-initramfs.sh ${{ matrix.arch }}

      - name: Upload initramfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-${{ matrix.arch }}
          path: build/initramfs.img

  build-uki:
    needs: [build-kernel, build-initramfs]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - uses: actions/checkout@v5

      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-build-${{ matrix.arch }}
          path: build/kernel/${{ matrix.arch }}/

      - name: Download initramfs artifact
        uses: actions/download-artifact@v4
        with:
          name: initramfs-${{ matrix.arch }}
          path: build/

      - name: Build UKI
        run: |
          bash scripts/build-uki.sh ${{ matrix.arch }}

      - name: Upload UKI artifact
        uses: actions/upload-artifact@v4
        with:
          name: uki-${{ matrix.arch }}
          path: build/muak-*.efi

  build-iso:
    needs: build-uki
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - uses: actions/checkout@v5

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools

      - name: Download UKI artifact
        uses: actions/download-artifact@v4
        with:
          name: uki-${{ matrix.arch }}
          path: output/${{ matrix.arch }}/

      - name: Build ISO
        run: |
          ARCH=${{ matrix.arch }} bash scripts/build-iso.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.arch }}
          path: output/${{ matrix.arch }}/muak-*.iso
