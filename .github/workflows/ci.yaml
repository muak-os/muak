name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v[0-9]+.*"]
  merge_group:
  workflow_dispatch:
    inputs:
      build:
        description: "Build and push images, ignoring the change detection"
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: just@1.58.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - run: just lint

  deny:
    name: Deny
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: just@1.58.0,cargo-deny@0.20.2

      - run: just deny licenses bans sources

  test:
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: just@1.58.0,cargo-nextest@0.9.146

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - run: just test

  features:
    name: Features
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: just@1.58.0,cargo-hack@0.6.45

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - run: just features

  docs:
    name: Docs
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: just@1.58.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - run: just docs

  ci-success:
    name: CI success
    if: always()
    needs: [lint, deny, test, features, docs]
    runs-on: ubuntu-26.04
    steps:
      - name: Check required jobs
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            exit 1
          fi

  changes:
    name: Changes
    needs: ci-success
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.build)
    permissions:
      contents: read
    uses: ./.github/workflows/changes.yaml
    with:
      force_all: ${{ github.event_name == 'workflow_dispatch' && inputs.build }}

  build-toolchain:
    name: Build toolchain
    needs: [ci-success, changes]
    if: needs.changes.result == 'success' && needs.changes.outputs.toolchain == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-toolchain.yaml

  build-packages:
    name: Build packages
    needs: [ci-success, changes]
    if: needs.changes.result == 'success' && needs.changes.outputs.packages != '[]'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-packages.yaml
    with:
      packages: ${{ needs.changes.outputs.packages }}

  build-cli:
    name: Build CLI
    needs: [ci-success, changes]
    if: needs.changes.result == 'success' && needs.changes.outputs.cli == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-cli.yaml

  build-installer:
    name: Build installer
    needs: [ci-success, changes, build-packages, build-cli]
    if: |
      always() &&
      needs.ci-success.result == 'success' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.installer == 'true' &&
      (needs.build-packages.result == 'success' || needs.build-packages.result == 'skipped') &&
      (needs.build-cli.result == 'success' || needs.build-cli.result == 'skipped')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-installer.yaml
    secrets: inherit
