name: Build (template)

on:
  workflow_call:
    inputs:
      image:
        description: "Image name used for cache refs and summary (e.g. muakctl, installer)"
        type: string
        required: true
      image_prefix:
        description: "Optional registry path prefix before image (e.g. 'pkgs/' for packages)"
        type: string
        default: ""
      toolchain:
        description: "Toolchain image reference for fresh toolchain builds"
        type: string
        default: ""
      recipe:
        description: "Full just recipe to run (e.g. 'oci cli', 'oci installer')"
        type: string
        required: true
      sign:
        description: "Run 'just sign' after the build step (installer only)"
        type: boolean
        default: false
      arch_matrix:
        description: "JSON array of architectures to build"
        type: string
        default: '["amd64","arm64"]'
    outputs:
      tag:
        description: "Resolved image tag"
        value: ${{ jobs.manifest.outputs.tag }}
      repository:
        description: "Resolved image repository"
        value: ${{ jobs.manifest.outputs.repository }}
      ref:
        description: "Resolved image reference"
        value: ${{ jobs.manifest.outputs.ref }}
    secrets:
      COSIGN_KEY:
        required: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch_matrix) }}
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        id: buildx

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: just@1.58.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select toolchain
        if: inputs.toolchain != ''
        run: |
          printf 'TOOLCHAIN=%s\n' "${{ inputs.toolchain }}" >> "$GITHUB_ENV"

      - name: Determine tag
        id: tag
        run: |
          set -euo pipefail

          tag="$(git describe --tags --always --dirty --match 'v[0-9]*' 2>/dev/null || true)"
          [ -n "$tag" ] || tag="0.0.0-dev"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Release tag matches Cargo.toml
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            0.0.0-dev | dev | *-dirty* | *-[0-9]*-g*)
              echo "Non-release tag '$TAG': version check skipped"
              exit 0
              ;;
          esac
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$TAG" != "v${cargo_version}" ]]; then
            echo "::error::Release tag '$TAG' does not match Cargo.toml version 'v${cargo_version}'"
            exit 1
          fi
          echo "Release tag '$TAG' matches Cargo.toml version 'v${cargo_version}'"

      - name: Build ${{ inputs.image }} (${{ matrix.arch }})
        env:
          CONTAINER_RUNTIME: docker
          ARCH: ${{ matrix.arch }}
          TAG: ci-${{ matrix.arch }}
          RECIPE: ${{ inputs.recipe }}
          KOCI_REGISTRY_USERNAME: ${{ github.actor }}
          KOCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: just $RECIPE

  manifest:
    name: Combine multi-arch manifest
    needs: build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-26.04
    env:
      CONTAINER_RUNTIME: docker
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      repository: ${{ steps.metadata.outputs.repository }}
      ref: ${{ steps.metadata.outputs.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: just@1.58.0

      - name: Resolve image metadata
        id: metadata
        env:
          IMAGE_PREFIX: ${{ inputs.image_prefix }}
          IMAGE: ${{ inputs.image }}
        run: |
          tag="${{ needs.build.outputs.tag }}"
          repository="ghcr.io/${{ github.repository_owner }}/${IMAGE_PREFIX}${IMAGE}"
          printf 'tag=%s\nrepository=%s\nref=%s\n' \
            "$tag" "$repository" "$repository:$tag" >> "$GITHUB_OUTPUT"

      - name: Select toolchain
        if: inputs.toolchain != ''
        run: |
          printf 'TOOLCHAIN=%s\n' "${{ inputs.toolchain }}" >> "$GITHUB_ENV"

      - name: Create multi-arch manifest (${{ needs.build.outputs.tag }})
        env:
          TAG: ${{ needs.build.outputs.tag }}
          IMAGE_PREFIX: ${{ inputs.image_prefix }}
          IMAGE: ${{ inputs.image }}
          KOCI_REGISTRY_USERNAME: ${{ github.actor }}
          KOCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="${IMAGE_PREFIX}${IMAGE}"
          just merge "$NAME" amd64=ci-amd64 arm64=ci-arm64

      - name: Setup cosign key
        if: inputs.sign
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$COSIGN_KEY" > cosign.key
          chmod 600 cosign.key

      - name: Sign ${{ inputs.image }}
        if: inputs.sign
        env:
          CONTAINER_RUNTIME: docker
          TAG: ${{ needs.build.outputs.tag }}
          SIGNATURE: cosign.key
          KOCI_REGISTRY_USERNAME: ${{ github.actor }}
          KOCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: just sign

      - name: Cleanup cosign key
        if: inputs.sign && always()
        run: rm -f cosign.key

      - name: Build summary
        env:
          IMAGE_PREFIX: ${{ inputs.image_prefix }}
          IMAGE: ${{ inputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          NAME="${IMAGE_PREFIX}${IMAGE}"
          printf '### Multi-arch manifest created for %s\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- **Tag:** `%s:%s`\n' "$NAME" "$TAG" >> "$GITHUB_STEP_SUMMARY"
