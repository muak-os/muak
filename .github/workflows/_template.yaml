name: Build (template)

on:
  workflow_call:
    inputs:
      image:
        description: "Image name used for cache refs and summary (e.g. muakctl, installer, kernel)"
        type: string
        required: true
      image_prefix:
        description: "Optional registry path prefix before image (e.g. 'pkgs/' for packages)"
        type: string
        default: ""
      recipe:
        description: "Full just recipe to run (e.g. 'oci cli', 'kernel', 'oci installer')"
        type: string
        required: true
      push:
        description: "Push the image to the registry"
        type: boolean
        default: false
      latest:
        description: "Tag the image as latest"
        type: boolean
        default: false
      tag:
        description: "Explicit tag to pass as TAG= (used by installer dispatch input)"
        type: string
        default: ""
      free_disk_space:
        description: "Run disk-space cleanup before checkout (kernel only)"
        type: boolean
        default: false
      sign:
        description: "Run 'just sign' after the build step (installer only)"
        type: boolean
        default: false
      arch_matrix:
        description: "JSON array of architectures to build"
        type: string
        default: '["amd64","arm64"]'
    secrets:
      COSIGN_KEY:
        required: false
      KERNEL_SIGNING_KEY:
        required: false

env:
  REGISTRY: ghcr.io/muak-os

jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch_matrix) }}
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free disk space
        if: inputs.free_disk_space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune -af
          df -h

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4
        id: buildx

      - uses: crazy-max/ghaction-github-runtime@v4

      - uses: taiki-e/install-action@just

      - uses: docker/login-action@v4
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(git describe --tag --always --dirty --match v[0-9]* 2>/dev/null || echo dev)" >> $GITHUB_OUTPUT
          fi

      - name: Setup cosign key
        if: inputs.sign
        run: |
          echo "${{ secrets.COSIGN_KEY }}" > cosign.key
          chmod 600 cosign.key

      - name: Setup kernel signing key
        env:
          KERNEL_SIGNING_KEY: ${{ secrets.KERNEL_SIGNING_KEY }}
        run: |
          if [[ -n "${KERNEL_SIGNING_KEY}" ]]; then
            echo "${KERNEL_SIGNING_KEY}" > /tmp/kernel-signing-key.pem
            chmod 600 /tmp/kernel-signing-key.pem
          fi

      - name: Build ${{ inputs.image }} (${{ matrix.arch }})
        env:
          KERNEL_SIGNING_KEY: ${{ secrets.KERNEL_SIGNING_KEY }}
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ inputs.image_prefix }}${{ inputs.image }}"
          CACHE_SCOPE="${{ inputs.image_prefix }}${{ inputs.image }}-${{ matrix.arch }}"
          CACHE_ARGS="--cache-from=type=gha,scope=${CACHE_SCOPE}"
          if [[ "${{ inputs.push }}" == "true" ]]; then
            CACHE_ARGS="${CACHE_ARGS} --cache-from=type=registry,ref=${IMAGE_REF}:buildcache-${{ matrix.arch }}"
            CACHE_ARGS="${CACHE_ARGS} --cache-to=type=gha,scope=${CACHE_SCOPE},mode=max"
            CACHE_ARGS="${CACHE_ARGS} --cache-to=type=registry,ref=${IMAGE_REF}:buildcache-${{ matrix.arch }},mode=max"
          else
            CACHE_ARGS="${CACHE_ARGS} --cache-to=type=gha,scope=${CACHE_SCOPE},mode=max"
          fi
          KERNEL_SIGNING_ARG=""
          if [[ -n "${KERNEL_SIGNING_KEY}" ]]; then
            KERNEL_SIGNING_ARG="--secret id=kernel_key,src=/tmp/kernel-signing-key.pem"
          fi
          CONTAINER_RUNTIME=docker \
          PUSH=${{ inputs.push }} \
          LATEST=${{ inputs.latest }} \
          TAG=${{ steps.tag.outputs.tag }} \
          KERNEL_SIGNING="${KERNEL_SIGNING_ARG}" \
          CI_ARGS="--builder=${{ steps.buildx.outputs.name }} ${CACHE_ARGS}" \
          just ${{ inputs.recipe }}

      - name: Sign ${{ inputs.image }} (${{ matrix.arch }})
        if: inputs.sign
        run: |
          CONTAINER_RUNTIME=docker \
          TAG=${{ steps.tag.outputs.tag }} \
          just sign

      - name: Cleanup cosign key
        if: inputs.sign && always()
        run: rm -f cosign.key

      - name: Cleanup kernel signing key
        if: always()
        env:
          KERNEL_SIGNING_KEY: ${{ secrets.KERNEL_SIGNING_KEY }}
        run: |
          if [[ -n "${KERNEL_SIGNING_KEY}" ]]; then
            rm -f /tmp/kernel-signing-key.pem
          fi

      - name: Build summary
        if: inputs.push
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ inputs.image_prefix }}${{ inputs.image }}"
          echo "### ${{ inputs.image }} (${{ matrix.arch }}) Built" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${IMAGE_REF}:${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
