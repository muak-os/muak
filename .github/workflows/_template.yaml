name: Build (template)

on:
  workflow_call:
    inputs:
      image:
        description: "Full image path"
        type: string
        required: true
      ref:
        description: "Git ref to build; defaults to the workflow commit"
        type: string
        default: ""
      tag:
        description: "Final image tag"
        type: string
        required: true
      toolchain:
        description: "Toolchain image reference for fresh toolchain builds"
        type: string
        default: ""
      recipe:
        description: "Full just recipe to run (e.g. 'oci cli', 'oci installer')"
        type: string
        required: true
      sign:
        description: "Run 'just sign' after the build step (installer only)"
        type: boolean
        default: false
      arch_matrix:
        description: "JSON array of architectures to build"
        type: string
        default: '["amd64","arm64"]'
    outputs:
      ref:
        description: "Resolved image reference"
        value: ${{ jobs.manifest.outputs.ref }}
    secrets:
      COSIGN_KEY:
        required: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch_matrix) }}
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        id: buildx

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: just@1.58.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select toolchain
        if: inputs.toolchain != ''
        run: |
          printf 'TOOLCHAIN=%s\n' "${{ inputs.toolchain }}" >> "$GITHUB_ENV"

      - name: Build ${{ inputs.image }} (${{ matrix.arch }})
        env:
          CONTAINER_RUNTIME: docker
          ARCH: ${{ matrix.arch }}
          TAG: ci-${{ matrix.arch }}
          RECIPE: ${{ inputs.recipe }}
          KOCI_REGISTRY_USERNAME: ${{ github.actor }}
          KOCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: just $RECIPE

  manifest:
    name: Combine multi-arch manifest
    needs: build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-26.04
    env:
      CONTAINER_RUNTIME: docker
      IMAGE: ${{ inputs.image }}
      TAG: ${{ inputs.tag }}
    outputs:
      ref: ${{ steps.metadata.outputs.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: just@1.58.0

      - name: Resolve image metadata
        id: metadata
        run: |
          repository="ghcr.io/${{ github.repository_owner }}/${IMAGE}"
          printf 'ref=%s\n' "$repository:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Select toolchain
        if: inputs.toolchain != ''
        run: |
          printf 'TOOLCHAIN=%s\n' "${{ inputs.toolchain }}" >> "$GITHUB_ENV"

      - name: Create multi-arch manifest (${{ inputs.tag }})
        env:
          KOCI_REGISTRY_USERNAME: ${{ github.actor }}
          KOCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          just merge "$IMAGE" amd64=ci-amd64 arm64=ci-arm64

      - name: Setup cosign key
        if: inputs.sign
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$COSIGN_KEY" > cosign.key
          chmod 600 cosign.key

      - name: Sign ${{ inputs.image }}
        if: inputs.sign
        env:
          CONTAINER_RUNTIME: docker
          SIGNATURE: cosign.key
          KOCI_REGISTRY_USERNAME: ${{ github.actor }}
          KOCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: just sign

      - name: Cleanup cosign key
        if: inputs.sign && always()
        run: rm -f cosign.key

      - name: Build summary
        run: |
          printf '### Multi-arch manifest created for %s\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- **Tag:** `%s:%s`\n' "$IMAGE" "$TAG" >> "$GITHUB_STEP_SUMMARY"
