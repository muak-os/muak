name: Build Kernel

on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:
    inputs:
      latest:
        description: "Tag the image as latest"
        required: false
        type: boolean
        default: true
      tag:
        description: "Tag to build (defaults to current commit)"
        required: false
        type: string

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_template.yaml
    with:
      image: kernel
      recipe: kernel
      push: true
      latest: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.latest) }}
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
      free_disk_space: true
    secrets:
      KERNEL_SIGNING_KEY: ${{ secrets.KERNEL_SIGNING_KEY }}
