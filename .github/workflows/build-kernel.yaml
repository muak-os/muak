name: Build Kernel

on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-kernel:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune -af
          df -h

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3
        id: buildx

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup signing key
        run: |
          echo "${{ secrets.KERNEL_SIGNING_KEY }}" > /tmp/kernel-signing-key.pem
          chmod 600 /tmp/kernel-signing-key.pem

      - name: Build kernel (${{ matrix.arch }})
        run: |
          make oci kernel \
            CONTAINER_RUNTIME=docker \
            PUSH=true \
            LATEST=${{ startsWith(github.ref, 'refs/tags/') }} \
            REGISTRY=${{ env.REGISTRY }}/sawangg \
            SIGNING_ARGS="--secret id=kernel_key,src=/tmp/kernel-signing-key.pem" \
            CI_ARGS="--builder=${{ steps.buildx.outputs.name }} --cache-from=type=registry,ref=${{ env.REGISTRY }}/sawangg/kernel:buildcache-${{ matrix.arch }} --cache-to=type=registry,ref=${{ env.REGISTRY }}/sawangg/kernel:buildcache-${{ matrix.arch }},mode=max"

      - name: Cleanup signing key
        if: always()
        run: rm -f /tmp/kernel-signing-key.pem

      - name: Build summary
        run: |
          TAG=$(git describe --tag --always --dirty --match v[0-9]* 2>/dev/null || echo dev)
          echo "### Kernel (${{ matrix.arch }}) Built :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/sawangg/kernel:${TAG}\`" >> $GITHUB_STEP_SUMMARY
