name: Build Kernel

on:
  push:
    branches: [master]
    paths:
      - "pkgs/kernel/**"
      - ".github/workflows/build-kernel.yaml"
    tags:
      - "v[0-9]+.*"
  pull_request:
    paths:
      - "pkgs/kernel/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build kernel
        run: |
          make oci-kernel \
            PUSH=${{ github.event_name != 'pull_request' }} \
            REGISTRY=${{ env.REGISTRY }}/sawangg \
            CI_ARGS="--cache-from=type=registry,ref=${{ env.REGISTRY }}/sawangg/kernel:buildcache --cache-to=type=registry,ref=${{ env.REGISTRY }}/sawangg/kernel:buildcache,mode=max"

      - name: Build summary
        if: github.event_name != 'pull_request'
        run: |
          TAG=$(git describe --tag --always --dirty --match v[0-9]* 2>/dev/null || echo dev)
          echo "### Kernel Built :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/sawangg/kernel:${TAG}\`" >> $GITHUB_STEP_SUMMARY
