---
name: Build Installer Image

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  KERNEL_VERSION: "6.17.8"

jobs:
  build-installer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/sawangg/installer
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push installer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/sawangg/installer:buildcache
            type=registry,ref=${{ env.REGISTRY }}/sawangg/installer:latest
          cache-to: type=registry,ref=${{ env.REGISTRY }}/sawangg/installer:buildcache,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            PKG_KERNEL=${{ env.REGISTRY }}/sawangg/kernel:${{ env.KERNEL_VERSION }}
            PKG_GRANOLA=${{ env.REGISTRY }}/sawangg/pkgs/granola:latest
            PKG_INIT=${{ env.REGISTRY }}/sawangg/pkgs/init:latest
            PKG_IMAGER=${{ env.REGISTRY }}/sawangg/pkgs/imager:latest
            PKG_YUKI=${{ env.REGISTRY }}/sawangg/pkgs/yuki:latest
            PKG_STUB=${{ env.REGISTRY }}/sawangg/pkgs/stub:latest
