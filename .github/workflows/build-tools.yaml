name: Build Tools

on:
  push:
    branches: [master]
    paths:
      - "tools/miso/**"
      - "tools/imager/**"
      - "tools/ramune/**"
      - "tools/yuki/**"
      - "libs/erofs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "rust-toolchain.toml"
      - ".dockerignore"
    tags:
      - "v[0-9]+.*"
  pull_request:
    paths:
      - "tools/miso/**"
      - "tools/imager/**"
      - "tools/ramune/**"
      - "tools/yuki/**"
      - "libs/erofs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "rust-toolchain.toml"
      - ".dockerignore"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_template.yaml
    with:
      image: tools
      recipe: oci tools
      push: ${{ github.event_name != 'pull_request' }}
      latest: ${{ startsWith(github.ref, 'refs/tags/') }}
      arch_matrix: '["amd64"]'
