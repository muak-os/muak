name: Build Tools

on:
  push:
    branches: [master]
    paths:
      - "tools/imager/**"
      - "tools/ramune/**"
      - "tools/yuki/**"
      - "libs/erofs/**"
    tags:
      - "v[0-9]+.*"
  pull_request:
    paths:
      - "tools/imager/**"
      - "tools/ramune/**"
      - "tools/yuki/**"
      - "libs/erofs/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/muak-os

jobs:
  build-tools:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3
        id: buildx

      - uses: taiki-e/install-action@just

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tools (${{ matrix.arch }})
        run: |
          CACHE_ARGS="--cache-from=type=registry,ref=${{ env.REGISTRY }}/tools:buildcache-${{ matrix.arch }}"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            CACHE_ARGS="${CACHE_ARGS} --cache-to=type=registry,ref=${{ env.REGISTRY }}/tools:buildcache-${{ matrix.arch }},mode=max"
          fi
          CONTAINER_RUNTIME=docker \
          PUSH=${{ github.event_name != 'pull_request' }} \
          LATEST=${{ startsWith(github.ref, 'refs/tags/') }} \
          CI_ARGS="--builder=${{ steps.buildx.outputs.name }} ${CACHE_ARGS}" \
          just oci tools

      - name: Build summary
        if: github.event_name != 'pull_request'
        run: |
          TAG=$(git describe --tag --always --dirty --match v[0-9]* 2>/dev/null || echo dev)
          echo "### tools (${{ matrix.arch }}) Built :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/tools:${TAG}\`" >> $GITHUB_STEP_SUMMARY
