syntax = "proto3";

package muak.internal.vm;

service VmService {
  rpc Create(CreateVmRequest) returns (CreateVmResponse);
  rpc Start(StartVmRequest) returns (StartVmResponse);
  rpc Stop(StopVmRequest) returns (StopVmResponse);
  rpc Delete(DeleteVmRequest) returns (DeleteVmResponse);

  rpc Get(GetVmRequest) returns (VmInfo);
  rpc List(ListVmsRequest) returns (ListVmsResponse);

  rpc UploadFile(stream UploadFileChunk) returns (UploadFileResponse);

  rpc GetSerialLog(GetSerialLogRequest) returns (GetSerialLogResponse);
}

message VmConfig {
  string name = 1;
  uint32 cpus = 2;
  uint64 memory_mb = 3;
  string kernel = 4;
  string initrd = 5;
  string cmdline = 6;
  repeated DiskConfig disks = 7;
  Hypervisor hypervisor = 8;
}

message DiskConfig {
  string path = 1;
  bool readonly = 2;
}

enum Hypervisor {
  HYPERVISOR_UNSPECIFIED = 0;
  HYPERVISOR_FIRECRACKER = 1;
  HYPERVISOR_CLOUD_HYPERVISOR = 2;
  HYPERVISOR_QEMU = 3;
}

enum VmState {
  VM_STATE_UNSPECIFIED = 0;
  VM_STATE_CREATED = 1;
  VM_STATE_STARTING = 2;
  VM_STATE_RUNNING = 3;
  VM_STATE_STOPPING = 4;
  VM_STATE_STOPPED = 5;
  VM_STATE_FAILED = 6;
}

message VmInfo {
  string vm_id = 1;
  string name = 2;
  VmState state = 3;
  VmConfig config = 4;
  int32 pid = 5;
  int64 created_at = 6;
  int64 started_at = 7;
  string tap_device = 8;
  string mac_address = 9;
}

message CreateVmRequest {
  VmConfig config = 1;
}

message CreateVmResponse {
  string vm_id = 1;
}

message StartVmRequest {
  string vm_id = 1;
}

message StartVmResponse {}

message StopVmRequest {
  string vm_id = 1;
  bool force = 2;
}

message StopVmResponse {}

message DeleteVmRequest {
  string vm_id = 1;
}

message DeleteVmResponse {}

message GetVmRequest {
  string vm_id = 1;
}

message ListVmsRequest {}

message ListVmsResponse {
  repeated VmInfo vms = 1;
}

message UploadFileChunk {
  oneof data {
    UploadFileMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message UploadFileMetadata {
  string filename = 1;
  int64 size = 2;
}

message UploadFileResponse {
  string path = 1;
}

message GetSerialLogRequest {
  string vm_id = 1;
  int64 tail_lines = 2;  // 0 = all lines
}

message GetSerialLogResponse {
  string content = 1;
}
