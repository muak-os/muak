syntax = "proto3";

package muak.provision.v1;

// ProvisionService provides system observability operations.
// Note: Install and Update operations are handled directly by granola
// when booted from the live ISO (maintenance mode), not through this API.
service ProvisionService {
    // List available block devices
    rpc ListDisks(ListDisksRequest) returns (ListDisksResponse);

    // Stream kernel logs
    rpc GetLogs(GetLogsRequest) returns (stream GetLogsResponse);
}

message GetLogsRequest {}

message GetLogsResponse {
    string line = 1;
    string error = 2;
}

message PartitionInfo {
    uint32 number = 1;
    uint64 start_sector = 2;
    uint64 size_bytes = 3;
    string name = 4;
    string path = 5;
    string fstype = 6;
}

message DiskInfo {
    string name = 1;
    string path = 2;
    uint64 size_bytes = 3;
    string model = 4;
    bool removable = 5;
    bool read_only = 6;
    repeated PartitionInfo partitions = 7;
}

message ListDisksRequest {}

message ListDisksResponse {
    repeated DiskInfo disks = 1;
    string error = 2;
}
