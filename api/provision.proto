syntax = "proto3";

package muak.provision.v1;

service ProvisionService {
    // @rbac: maintenance|admin
    rpc Install(InstallRequest) returns (stream InstallProgress);

    // @rbac: system:update
    rpc PrepareUpdate(PrepareUpdateRequest) returns (stream PrepareUpdateProgress);

    // @rbac: system:update
    rpc Update(UpdateRequest) returns (UpdateResponse);

    // @rbac: system:read
    rpc GetUpdateStatus(GetUpdateStatusRequest) returns (GetUpdateStatusResponse);

    // @rbac: maintenance|system:read
    rpc ListDisks(ListDisksRequest) returns (ListDisksResponse);

    // @rbac: system:read
    rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);

    // @rbac: system:read
    rpc GetConfigHistory(GetConfigHistoryRequest) returns (GetConfigHistoryResponse);

    // @rbac: system:read
    rpc GetConfigSnapshot(GetConfigSnapshotRequest) returns (GetConfigSnapshotResponse);

    // @rbac: admin
    rpc FactoryReset(FactoryResetRequest) returns (FactoryResetResponse);
}

enum UpdateStatus {
    UPDATE_STATUS_UNKNOWN = 0;
    UPDATE_STATUS_PENDING = 1;
    UPDATE_STATUS_COMMITTED = 2;
    UPDATE_STATUS_ROLLED_BACK = 3;
}

message GetUpdateStatusRequest {
    string update_id = 1;
}

message GetUpdateStatusResponse {
    UpdateStatus status = 1;
    string error = 2;
}

message InstallRequest {
    bool force = 1;
    bytes config_bytes = 2;
    string csr = 3;
}

message InstallProgress {
    string message = 1;
    string ca_pem = 2;
    string client_cert_pem = 3;
    string server_name = 4;
    string error = 5;
}

message PrepareUpdateRequest {
    string image = 1;
    bytes config = 2;
}

message PrepareUpdateProgress {
    string message = 1;
    string update_id = 2;
    string error = 3;
}

message UpdateRequest {
    string update_id = 1;
}

message UpdateResponse {
    bool success = 1;
    string error = 2;
}

message PartitionInfo {
    uint32 number = 1;
    uint64 start_sector = 2;
    uint64 size_bytes = 3;
    string name = 4;
    string path = 5;
    string fstype = 6;
}

message DiskInfo {
    string name = 1;
    string path = 2;
    uint64 size_bytes = 3;
    string model = 4;
    bool removable = 5;
    bool read_only = 6;
    repeated PartitionInfo partitions = 7;
}

message ListDisksRequest {}

message ListDisksResponse {
    repeated DiskInfo disks = 1;
    string error = 2;
}

message GetConfigRequest {}

message GetConfigResponse {
    bytes config = 1;
    string error = 2;
}

message ConfigHistoryEntry {
    int64 timestamp = 1;
    string update_id = 2;
    string author = 3;
    string change_kind = 4;
}

message GetConfigHistoryRequest {
    uint32 limit = 1;
}

message GetConfigHistoryResponse {
    repeated ConfigHistoryEntry entries = 1;
    string error = 2;
}

message GetConfigSnapshotRequest {
    string update_id = 1;
}

message GetConfigSnapshotResponse {
    bytes config = 1;
    string error = 2;
}

message FactoryResetRequest {}

message FactoryResetResponse {
    bool success = 1;
    string error = 2;
}
