syntax = "proto3";

package muak.provision.v1;

service ProvisionService {
    // @rbac: maintenance|admin
    rpc Install(InstallRequest) returns (stream InstallProgress);

    // @rbac: system:update
    rpc PrepareUpdate(PrepareUpdateRequest) returns (PrepareUpdateResponse);

    // @rbac: system:update
    rpc Update(UpdateRequest) returns (UpdateResponse);

    // @rbac: system:read
    rpc GetUpdateStatus(GetUpdateStatusRequest) returns (GetUpdateStatusResponse);

    // @rbac: maintenance|system:read
    rpc ListDisks(ListDisksRequest) returns (ListDisksResponse);

    // @rbac: system:read
    rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);

    // @rbac: admin
    rpc FactoryReset(FactoryResetRequest) returns (FactoryResetResponse);
}

enum UpdateStatus {
    UPDATE_STATUS_UNKNOWN = 0;
    UPDATE_STATUS_PENDING = 1;
    UPDATE_STATUS_COMMITTED = 2;
    UPDATE_STATUS_ROLLED_BACK = 3;
}

message GetUpdateStatusRequest {
    string update_id = 1;
}

message GetUpdateStatusResponse {
    UpdateStatus status = 1;
    string error = 2;
}

message InstallRequest {
    bool force = 1;
    bytes config_toml = 2;
    string csr = 3;
}

enum InstallStep {
    UNKNOWN = 0;
    VALIDATING = 1;
    GENERATING_KEYS = 2;
    GENERATING_PKI = 3;
    PULLING_IMAGE = 4;
    BUILDING_UKI = 5;
    SIGNING_UKI = 6;
    PARTITIONING = 7;
    FORMATTING = 8;
    DEPLOYING = 9;
    INITIALIZING = 10;
    COMPLETED = 11;
    FAILED = 12;
}

message InstallProgress {
    InstallStep step = 1;
    string message = 2;
    string ca_pem = 3;
    string client_cert_pem = 4;
    string server_name = 5;
    string error = 6;
}

message PrepareUpdateRequest {
    string image = 1;
}

message PrepareUpdateResponse {
    bool success = 1;
    string update_id = 2;
    string error = 3;
}

message UpdateRequest {
    string update_id = 1;
}

message UpdateResponse {
    bool success = 1;
    string error = 2;
}

message PartitionInfo {
    uint32 number = 1;
    uint64 start_sector = 2;
    uint64 size_bytes = 3;
    string name = 4;
    string path = 5;
    string fstype = 6;
}

message DiskInfo {
    string name = 1;
    string path = 2;
    uint64 size_bytes = 3;
    string model = 4;
    bool removable = 5;
    bool read_only = 6;
    repeated PartitionInfo partitions = 7;
}

message ListDisksRequest {}

message ListDisksResponse {
    repeated DiskInfo disks = 1;
    string error = 2;
}

message GetConfigRequest {}

message GetConfigResponse {
    bytes config = 1;
    string error = 2;
}

message FactoryResetRequest {}

message FactoryResetResponse {
    bool success = 1;
    string error = 2;
}
