syntax = "proto3";

package muak.maintenance.v1;

service MaintenanceService {
    rpc Install(InstallRequest) returns (InstallResponse);
    rpc ListDisks(ListDisksRequest) returns (ListDisksResponse);
}

message InstallRequest {
    string target_disk = 1;         // e.g., "/dev/sda" or "/dev/nvme0n1"
    bool force = 2;                 // Force installation even if disk has data
    optional bool auto_reboot = 3;  // Automatically reboot after successful installation (default: true)
}

message InstallResponse {
    bool success = 1;
    string error = 2;      // Error message if failed
}

message PartitionInfo {
    uint32 number = 1;
    uint64 start_sector = 2;
    uint64 size_bytes = 3;
    string name = 4;
    string path = 5;
    string fstype = 6;
}

message DiskInfo {
    string name = 1;
    string path = 2;
    uint64 size_bytes = 3;
    string model = 4;
    bool removable = 5;
    bool read_only = 6;
    repeated PartitionInfo partitions = 7;
}

message ListDisksRequest {}

message ListDisksResponse {
    repeated DiskInfo disks = 1;
    string error = 2;
}
