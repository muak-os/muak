syntax = "proto3";

package muak.vm.v1;

service VmService {
  rpc CreateVm(CreateVmRequest) returns (CreateVmResponse);
  rpc StartVm(StartVmRequest) returns (StartVmResponse);
  rpc StopVm(StopVmRequest) returns (StopVmResponse);
  rpc DeleteVm(DeleteVmRequest) returns (DeleteVmResponse);
  rpc GetVm(GetVmRequest) returns (GetVmResponse);
  rpc ListVms(ListVmsRequest) returns (ListVmsResponse);
  rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse);
  rpc GetVmSerialLog(GetVmSerialLogRequest) returns (GetVmSerialLogResponse);
}

enum Hypervisor {
  HYPERVISOR_UNSPECIFIED = 0;
  HYPERVISOR_FIRECRACKER = 1;
  HYPERVISOR_CLOUD_HYPERVISOR = 2;
  HYPERVISOR_QEMU = 3;
}

enum VmState {
  VM_STATE_UNSPECIFIED = 0;
  VM_STATE_CREATED = 1;
  VM_STATE_STARTING = 2;
  VM_STATE_RUNNING = 3;
  VM_STATE_STOPPING = 4;
  VM_STATE_STOPPED = 5;
  VM_STATE_FAILED = 6;
}

message VmConfig {
  string name = 1;
  uint32 cpus = 2;
  uint64 memory_mb = 3;
  string kernel = 4;
  string initrd = 5;
  string cmdline = 6;
  repeated DiskConfig disks = 7;
  Hypervisor hypervisor = 8;
}

message DiskConfig {
  string path = 1;
  bool readonly = 2;
}

message CreateVmRequest {
  VmConfig config = 1;
}

message CreateVmResponse {
  string vm_id = 1;
  string error = 2;
}

message StartVmRequest {
  string vm_id = 1;
}

message StartVmResponse {
  bool success = 1;
  string error = 2;
}

message StopVmRequest {
  string vm_id = 1;
  bool force = 2;
}

message StopVmResponse {
  bool success = 1;
  string error = 2;
}

message DeleteVmRequest {
  string vm_id = 1;
}

message DeleteVmResponse {
  bool success = 1;
  string error = 2;
}

message GetVmRequest {
  string vm_id = 1;
}

message GetVmResponse {
  VmInfo vm = 1;
  string error = 2;
}

message ListVmsRequest {}

message ListVmsResponse {
  repeated VmInfo vms = 1;
}

message VmInfo {
  string vm_id = 1;
  string name = 2;
  VmState state = 3;
  VmConfig config = 4;
  int32 pid = 5;
  int64 created_at = 6;
  int64 started_at = 7;
  string tap_device = 8;
  string mac_address = 9;
}

message UploadFileRequest {
  oneof request {
    UploadFileMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message UploadFileMetadata {
  string filename = 1;
  int64 size = 2;
}

message UploadFileResponse {
  string path = 1;
  string error = 2;
}

message GetVmSerialLogRequest {
  string vm_id = 1;
  int64 tail_lines = 2;  // 0 means all lines
}

message GetVmSerialLogResponse {
  string output = 1;
  string error = 2;
}
