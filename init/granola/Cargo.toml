[package]
name = "granola"
description = "Core gRPC APIs and shared service utilities"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Asynchronous
tokio = { workspace = true, features = ["signal", "fs", "io-util", "net", "sync"] }
tokio-stream = { workspace = true }

# Encoding
prost = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

# Error handling
anyhow = { workspace = true }

# gRPC
tonic = { workspace = true }
tonic-prost = { workspace = true }

# System/platform APIs
rustix = { workspace = true, features = ["net", "process"] }

# Internal
granola-macros = { workspace = true }
kmsg = { workspace = true }
config = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
protox = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
