[workspace]
members = [
    "cli",
    "e2e",

    "init/granola",
    "init/millefeuille",

    "services/apid",
    "services/consoled",
    "services/modd",
    "services/networkd",
    "services/provisiond",
    "services/timed",
    "services/workloadd",

    "toolchain/wizard",
    "toolchain/kata",
    "toolchain/koci",
    "toolchain/miso",
    "toolchain/mumi",
    "toolchain/ramune",
    "toolchain/sbolt",
    "toolchain/yuki",

    "libs/config",
    "libs/tui",
    "libs/granola-macros",
    "libs/sandbox",

    "libs/network/afpacket-linux",
    "libs/network/dhcp",
    "libs/network/dhcp-proto",
    "libs/network/icmpv6-linux",
    "libs/network/iface",
    "libs/network/ip",
    "libs/network/ip-method",
    "libs/network/ip-static",
    "libs/network/mac",
    "libs/network/ndp",
    "libs/network/netlink-linux",
    "libs/network/net-loop",
    "libs/network/netmodel",
    "libs/network/net-observe",
    "libs/network/net-runtime",
    "libs/network/net-runtime-tokio",
    "libs/network/net-supervisor",
    "libs/network/net-sys-linux",
    "libs/network/slaac",
    "libs/network/tap-linux",

    "libs/storage/blockdev",
    "libs/storage/disk",
    "libs/storage/luks2",
    "libs/storage/partdev",
    "libs/storage/parttable",

    "libs/fs/btrfs",
    "libs/fs/erofs",
    "libs/fs/fatfs",

    "libs/boot/esp",
    "libs/boot/firmware",
    "libs/boot/uki",

    "libs/crypto/pki",
    "libs/crypto/tpm2",

    "libs/container/oci",
    "libs/container/oci-client",

    "libs/kernel/kmod",
    "libs/kernel/kmsg",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/muak-os/muak"
readme = "README.md"
keywords = ["linux", "distribution", "immutable", "atomic", "declarative"]
categories = ["os"]

[workspace.dependencies]
# Internal crates

## Toolchain
kata = { path = "toolchain/kata", default-features = false }
wizard = { path = "toolchain/wizard", default-features = false }
koci = { path = "toolchain/koci", default-features = false }
miso = { path = "toolchain/miso", default-features = false }
mumi = { path = "toolchain/mumi", default-features = false }
ramune = { path = "toolchain/ramune", default-features = false }
sbolt = { path = "toolchain/sbolt", default-features = false }
yuki = { path = "toolchain/yuki", default-features = false }

## Libraries
config = { path = "libs/config" }
granola = { path = "init/granola" }
granola-macros = { path = "libs/granola-macros" }
sandbox = { path = "libs/sandbox", default-features = false }
tui = { path = "libs/tui", default-features = false }

## Network
afpacket-linux = { path = "libs/network/afpacket-linux" }
dhcp = { path = "libs/network/dhcp" }
dhcp-proto = { path = "libs/network/dhcp-proto" }
icmpv6-linux = { path = "libs/network/icmpv6-linux" }
iface = { path = "libs/network/iface", default-features = false }
ip = { path = "libs/network/ip", default-features = false }
ip-method = { path = "libs/network/ip-method" }
ip-static = { path = "libs/network/ip-static" }
mac = { path = "libs/network/mac" }
ndp = { path = "libs/network/ndp" }
netlink-linux = { path = "libs/network/netlink-linux" }
net-loop = { path = "libs/network/net-loop" }
netmodel = { path = "libs/network/netmodel" }
net-observe = { path = "libs/network/net-observe" }
net-runtime = { path = "libs/network/net-runtime", default-features = false }
net-runtime-tokio = { path = "libs/network/net-runtime-tokio" }
net-supervisor = { path = "libs/network/net-supervisor", default-features = false }
net-sys-linux = { path = "libs/network/net-sys-linux" }
slaac = { path = "libs/network/slaac" }
tap-linux = { path = "libs/network/tap-linux" }

## Storage
blockdev = { path = "libs/storage/blockdev", default-features = false }
disk = { path = "libs/storage/disk" }
luks2 = { path = "libs/storage/luks2" }
partdev = { path = "libs/storage/partdev", default-features = false }
parttable = { path = "libs/storage/parttable" }

## Fs
btrfs = { path = "libs/fs/btrfs" }
erofs = { path = "libs/fs/erofs" }
fatfs = { path = "libs/fs/fatfs" }

## Boot
esp = { path = "libs/boot/esp" }
firmware = { path = "libs/boot/firmware", default-features = false }
uki = { path = "libs/boot/uki" }

## Crypto
pki = { path = "libs/crypto/pki" }
tpm2 = { path = "libs/crypto/tpm2" }

## Container
oci = { path = "libs/container/oci" }
oci-client = { path = "libs/container/oci-client", default-features = false }

## Kernel
kmod = { path = "libs/kernel/kmod" }
kmsg = { path = "libs/kernel/kmsg" }

# External crates

## Asynchronous
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tokio-rustls = { version = "0.26", default-features = false }

## CLI
anstyle = "1.0"
clap = { version = "4.6", features = ["derive"] }
unicode-width = "0.2"

## Compression
flate2 = "1.1"
tar = "0.4"
zstd = { version = "0.14", default-features = false, features = ["zstdmt"] }

## Cryptography
aes = "0.9"
argon2 = { version = "0.6", default-features = false, features = ["password-hash", "alloc", "rand_core", "zeroize"] }
base16ct = { version = "1.0", features = ["alloc"] }
base64ct = { version = "1.8", features = ["std"] }
cms = "0.3.0-rc.2"
const-oid = "0.10"
der = { version = "0.8", features = ["alloc", "oid", "pem", "std"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
p256 = "0.14.0"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "getrandom", "pkcs1v15"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
sha2 = "0.11"
signature = "3.0"
spki = { version = "0.8", features = ["alloc", "pem"] }
webpki-roots = "1.0"
x509-cert = { version = "0.3", features = ["builder"] }
zeroize = "1.9"

## Encoding
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.14"
toml = "1.2"

## Error handling
anyhow = "1.0"
thiserror = "2.0"

## Filesystem
crc32c = "0.6"
crc32fast = "1.5"
tempfile = { version = "3.27", default-features = false }

## gRPC
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "router", "tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }
protox = "0.9"

## HTTP
hyper = { version = "1.11", features = ["http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring"] }
http-body-util = "0.1"

## Networking
netlink-packet-core = "0.8"
netlink-packet-route = "0.30"
netlink-proto = { version = "0.12", default-features = false }
netlink-sys = { version = "0.8", default-features = false }

## System/platform APIs
libc = { version = "0.2", default-features = false, features = ["std"] }
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "mount", "linux_latest"] }
uefi = "0.40"

## Utilities
bytes = "1.12"
object = { version = "0.39", default-features = false, features = ["read", "pe"] }
semver = { version = "1.0", default-features = false, features = ["std", "serde"] }
uuid = { version = "1.29", default-features = false, features = ["v4", "v7"] }

## Procedural macros
syn = { version = "3.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = 1
strip = false
lto = false

[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Cargo
multiple_crate_versions = "allow" # Remove if/when we stabilized the dependencies

# Nursey
debug_assert_with_mut_call = "warn"
missing_const_for_fn = "warn"
redundant_clone = "warn"
unused_peekable = "warn"

# Restriction
big_endian_bytes = "allow"
cognitive_complexity = "allow"
definition_in_module_root = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
field_scoped_visibility_modifiers = "allow"
implicit_return = "allow"
inline_trait_bounds = "allow"
little_endian_bytes = "allow"
missing_docs_in_private_items = "allow"
missing_inline_in_public_items = "allow"
missing_trait_methods = "allow"
mod_module_files = "allow"
non_ascii_literal = "allow"
pub_with_shorthand = "allow"
question_mark_used = "allow"
ref_patterns = "allow"
rest_pattern_accessible_field = "allow"
semicolon_outside_block = "allow"
separated_literal_suffix = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
shadow_unrelated = "allow"
single_call_fn = "allow"
single_char_lifetime_names = "allow"
std_instead_of_core = "allow" # TODO: remove when rust has a stable core::io
string_add = "allow"
use_debug = "allow"

# Suspicious
blanket_clippy_restriction_lints = "allow"

[workspace.lints.rust]
non_ascii_idents = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unnameable_types = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
