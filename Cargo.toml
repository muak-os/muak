[workspace]
members = [
    "cli",
    "internal/apid",
    "internal/granola",
    "internal/imager",
    "internal/init",
    "internal/modd",
    "internal/networkd",
    "internal/stub",
    "internal/vmd",
    "internal/yuki",
    "internal/shared/kmod",
    "internal/shared/kmsg",
    "internal/shared/notify",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49", features = ["rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# RPC and serialization
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# System/platform APIs
nix = { version = "0.30", features = ["fs", "mount"] }
uefi = { version = "0.36", features = ["alloc", "logger", "panic_handler", "global_allocator"] }

# Networking
rtnetlink = "0.20"
netlink-packet-route = "0.28"
netlink-packet-core = "0.8"
futures-util = "0.3"
dhcproto = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Utilities
tower = "0.5"
hyper = { version = "1.8", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
uuid = { version = "1.19", features = ["v4"] }
object = { version = "0.38", default-features = false, features = ["read", "write", "pe"] }
sha2 = "0.10"

# Filesystem
gptman = "2.0"
fatfs = "0.3"
backhand = "0.24"
cpio = "0.4"
walkdir = "2.5"
tempfile = "3.24"
zstd = "0.13"
tar = "0.4"
flate2 = "1.1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
