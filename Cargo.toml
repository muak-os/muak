[workspace]
members = [
    "cli",
    "e2e",

    "core/granola",
    "core/init",
    "core/stub",

    "services/apid",
    "services/consoled",
    "services/modd",
    "services/networkd",
    "services/provisiond",
    "services/timed",
    "services/vmd",

    "tools/koci",
    "tools/miso",
    "tools/ramune",
    "tools/yuki",

    "libs/btrfs",
    "libs/config",
    "libs/esp",
    "libs/parttable",
    "libs/kmod",
    "libs/kmsg",
    "libs/luks2",
    "libs/pki",
    "libs/sbolt",
    "libs/tpm2",
    "libs/erofs",
    "libs/granola-macros",
    "libs/netlib",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "1.0.0-beta"
license-file = "LICENSE"
repository = "https://github.com/muak-os/muak"
readme = "README.md"
keywords = ["linux", "distribution", "immutable", "atomic", "declarative"]
categories = ["os"]

[workspace.dependencies]
# Internal crates

koci = { path = "tools/koci", default-features = false }
ramune = { path = "tools/ramune", default-features = false }
yuki = { path = "tools/yuki", default-features = false }

btrfs = { path = "libs/btrfs" }
config = { path = "libs/config" }
erofs = { path = "libs/erofs" }
esp = { path = "libs/esp" }
granola = { path = "core/granola" }
granola-macros = { path = "libs/granola-macros" }
kmod = { path = "libs/kmod" }
kmsg = { path = "libs/kmsg" }
luks2 = { path = "libs/luks2" }
netlib = { path = "libs/netlib" }
parttable = { path = "libs/parttable" }
pki = { path = "libs/pki" }
sbolt = { path = "libs/sbolt" }
tpm2 = { path = "libs/tpm2" }

# External crates

## Asynchronous
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tokio-rustls = { version = "0.26", default-features = false }

## CLI
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events"] }

## Compression
flate2 = "1.1"
tar = "0.4"
zstd = { version = "0.13", default-features = false }

## Cryptography
ring = { version = "0.17", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
x509-cert = { version = "0.3.0-rc.4", features = ["builder"] }
der = { version = "0.8", features = ["alloc", "oid", "pem", "std"] }
spki = { version = "0.8", features = ["alloc", "pem"] }
signature = "3.0"
rsa = "0.10.0-rc.18"
cms = "0.3.0-pre.2"
aes = "0.9"
argon2 = { version = "0.6.0-rc.8", default-features = false, features = ["password-hash", "alloc", "rand_core", "zeroize"] }
zeroize = "1.8"
webpki-roots = "1.0"

## Encoding
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.14"
toml = "1.1"
base64ct = { version = "1.8", features = ["std"] }
const-oid = "0.10"

## Error handling
anyhow = "1.0"
thiserror = "2.0"

## Filesystem
gptman = { version = "3.1", default-features = false }
fatfs = { version = "0.3", default-features = false, features = ["std"] }
crc32c = "0.6"
tempfile = { version = "3.27", default-features = false }

## gRPC
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "router", "tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }
protox = "0.9"

## HTTP
hyper = { version = "1.9", features = ["http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring"] }
http-body-util = "0.1"

## Networking
rtnetlink = { version = "0.21", default-features = false, features = ["tokio_socket"] }

## System/platform APIs
libc = { version = "0.2", default-features = false, features = ["std"] }
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "mount", "linux_latest"] }
uefi = "0.37"

## Utilities
object = { version = "0.39", default-features = false, features = ["read", "write", "pe"] }
uuid = { version = "1.23", default-features = false, features = ["v4", "v7"] }

## Procedural macros
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = 1
strip = false
lto = false
