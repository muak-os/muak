[workspace]
members = [
    "cli",
    "internal/granola",
    "internal/imager",
    "internal/init",
    "internal/yuki",
    "internal/stub",
]
resolver = "3"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.48", features = ["rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# RPC and serialization
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# System/platform APIs
nix = { version = "0.30", features = ["fs", "mount"] }

# Networking
rtnetlink = "0.18"
netlink-packet-route = "0.25"
netlink-packet-core = "0.8"
futures-util = "0.3"
dhcproto = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Utilities
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
bincode = "1.3"
uuid = { version = "1.18", features = ["v4"] }
sha2 = "0.10"
anyhow = "1.0"

# Filesystem utilities
gptman = "2.0"
fatfs = "0.3"
backhand = "0.23"
cpio = "0.4"
walkdir = "2.5"
tempfile = "3.23"
zstd = "0.13"
tar = "0.4"
flate2 = "1.1"

# PE file handling
object = { version = "0.38", default-features = false, features = ["read", "write", "pe"] }

# UEFI support
uefi = { version = "0.36", features = ["alloc", "logger", "panic_handler", "global_allocator"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
