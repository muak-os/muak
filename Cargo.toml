[workspace]
members = [
    "cli",
    "e2e",

    "init/granola",
    "init/millefeuille",

    "services/apid",
    "services/consoled",
    "services/modd",
    "services/networkd",
    "services/provisiond",
    "services/timed",
    "services/workloadd",

    "toolchain/wizard",
    "toolchain/kata",
    "toolchain/koci",
    "toolchain/miso",
    "toolchain/mumi",
    "toolchain/ramune",
    "toolchain/sbolt",
    "toolchain/yuki",

    "libs/btrfs",
    "libs/config",
    "libs/disk",
    "libs/esp",
    "libs/parttable",
    "libs/kmod",
    "libs/kmsg",
    "libs/luks2",
    "libs/pki",
    "libs/tpm2",
    "libs/tui",
    "libs/erofs",
    "libs/fatfs",
    "libs/firmware",
    "libs/granola-macros",
    "libs/netlib",
    "libs/oci",
    "libs/oci-client",
    "libs/uki",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "1.0.3-beta"
rust-version = "1.98"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/muak-os/muak"
readme = "README.md"
keywords = ["linux", "distribution", "immutable", "atomic", "declarative"]
categories = ["os"]

[workspace.dependencies]
# Internal crates

## Toolchain
kata = { path = "toolchain/kata", default-features = false }
wizard = { path = "toolchain/wizard", default-features = false }
koci = { path = "toolchain/koci", default-features = false }
miso = { path = "toolchain/miso", default-features = false }
mumi = { path = "toolchain/mumi", default-features = false }
ramune = { path = "toolchain/ramune", default-features = false }
sbolt = { path = "toolchain/sbolt", default-features = false }
yuki = { path = "toolchain/yuki", default-features = false }

## Libraries
btrfs = { path = "libs/btrfs" }
config = { path = "libs/config" }
erofs = { path = "libs/erofs" }
esp = { path = "libs/esp" }
firmware = { path = "libs/firmware", default-features = false }
fatfs = { path = "libs/fatfs" }
granola = { path = "init/granola" }
granola-macros = { path = "libs/granola-macros" }
kmod = { path = "libs/kmod" }
kmsg = { path = "libs/kmsg" }
luks2 = { path = "libs/luks2" }
netlib = { path = "libs/netlib" }
oci = { path = "libs/oci" }
oci-client = { path = "libs/oci-client", default-features = false }
parttable = { path = "libs/parttable" }
disk = { path = "libs/disk" }
pki = { path = "libs/pki" }
tpm2 = { path = "libs/tpm2" }
tui = { path = "libs/tui", default-features = false }
uki = { path = "libs/uki" }

# External crates

## Asynchronous
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tokio-rustls = { version = "0.26", default-features = false }

## CLI
anstyle = "1.0"
clap = { version = "4.6", features = ["derive"] }
unicode-width = "0.2"

## Compression
flate2 = "1.1"
tar = "0.4"
zstd = { version = "0.14", default-features = false, features = ["zstdmt"] }

## Cryptography
aes = "0.9"
argon2 = { version = "0.6", default-features = false, features = ["password-hash", "alloc", "rand_core", "zeroize"] }
base16ct = { version = "1.0", features = ["alloc"] }
base64ct = { version = "1.8", features = ["std"] }
cms = "0.3.0-pre.2"
const-oid = "0.10"
der = { version = "0.8", features = ["alloc", "oid", "pem", "std"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
p256 = "0.14.0"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
rsa = "0.10.0-rc.18"
rustls = { version = "0.23", default-features = false, features = ["std"] }
sha2 = "0.11"
signature = "3.0"
spki = { version = "0.8", features = ["alloc", "pem"] }
subtle = "2.6"
webpki-roots = "1.0"
x509-cert = { version = "0.3", features = ["builder"] }
zeroize = "1.9"

## Encoding
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.14"
toml = "1.1"

## Error handling
anyhow = "1.0"
thiserror = "2.0"

## Filesystem
crc32c = "0.6"
crc32fast = "1.5"
tempfile = { version = "3.27", default-features = false }

## gRPC
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "router", "tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }
protox = "0.9"

## HTTP
hyper = { version = "1.11", features = ["http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring"] }
http-body-util = "0.1"

## Networking
rtnetlink = { version = "0.21", default-features = false, features = ["tokio_socket"] }

## System/platform APIs
libc = { version = "0.2", default-features = false, features = ["std"] }
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "mount", "linux_latest"] }
uefi = "0.40"

## Utilities
bytes = "1.12"
object = { version = "0.39", default-features = false, features = ["read", "pe"] }
semver = { version = "1.0", default-features = false, features = ["std", "serde"] }
uuid = { version = "1.29", default-features = false, features = ["v4", "v7"] }

## Procedural macros
syn = { version = "3.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = 1
strip = false
lto = false

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

multiple_crate_versions = "allow" # Remove if/when we stabilized the dependencies

arbitrary_source_item_ordering = "allow"
big_endian_bytes = "allow"
cognitive_complexity = "allow"
default_numeric_fallback = "allow"
definition_in_module_root = "allow"
disallowed_script_idents = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
field_scoped_visibility_modifiers = "allow"
float_arithmetic = "allow"
implicit_return = "allow"
inline_asm_x86_intel_syntax = "allow"
inline_modules = "allow"
inline_trait_bounds = "allow"
little_endian_bytes = "allow"
missing_asserts_for_indexing = "allow"
missing_docs_in_private_items = "allow"
missing_inline_in_public_items = "allow"
missing_trait_methods = "allow"
mod_module_files = "allow"
mutex_integer = "allow"
needless_raw_strings = "allow"
non_ascii_literal = "allow"
pathbuf_init_then_push = "allow"
print_stderr = "allow"
print_stdout = "allow"
pub_with_shorthand = "allow"
question_mark_used = "allow"
redundant_type_annotations = "allow"
ref_patterns = "allow"
rest_pattern_accessible_field = "allow"
semicolon_outside_block = "allow"
separated_literal_suffix = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
shadow_unrelated = "allow"
single_call_fn = "allow"
single_char_lifetime_names = "allow"
std_instead_of_core = "allow" # TODO: remove when we have a stable core::io
string_add = "allow"
unnecessary_rest_pattern = "allow"
unwrap_in_result = "allow"
use_debug = "allow"

blanket_clippy_restriction_lints = "allow"

[workspace.lints.rust]
non_ascii_idents = "deny"
