[package]
name = "consoled"
description = "Console status display daemon"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Asynchronous
tokio = { workspace = true, features = ["rt", "macros", "time", "signal", "net", "sync"] }

# Terminal
crossterm = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Internal
firmware = { workspace = true, features = ["linux"] }
granola = { workspace = true }
kmsg = { workspace = true }
config = { workspace = true }

# System/Platform APIs
rustix = { workspace = true, features = ["termios"] }

[lints]
workspace = true
