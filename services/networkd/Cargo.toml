[package]
name = "networkd"
description = "Network configuration and management daemon"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["ipv6"]
ipv6 = []

[dependencies]
# Asynchronous
tokio = { workspace = true, features = ["net", "sync", "time", "signal", "fs", "io-util"] }

# Error handling
anyhow = { workspace = true }

# Internal
granola = { workspace = true }
kmsg = { workspace = true }
config = { workspace = true }
mac = { workspace = true }
netdev = { workspace = true }
netlink = { workspace = true }
netlink-monitor = { workspace = true }
netstack = { workspace = true, features = ["ipv4", "ipv6"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
