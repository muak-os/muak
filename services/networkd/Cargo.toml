[package]
name = "networkd"
description = "Network configuration and management daemon"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["ipv4", "ipv6"]
ipv4 = ["net-loop/ipv4", "net-supervisor/ipv4"]
ipv6 = ["net-loop/ipv6", "net-supervisor/ipv6"]

[dependencies]
# Asynchronous
tokio = { workspace = true, features = ["net", "sync", "time", "signal", "fs", "io-util"] }

# Error handling
anyhow = { workspace = true }

# Internal
config = { workspace = true }
granola = { workspace = true }
kmsg = { workspace = true }
net-loop = { workspace = true, default-features = false }
net-runtime = { workspace = true, default-features = false }
net-runtime-linux = { workspace = true, default-features = false, features = ["tokio"] }
net-supervisor = { workspace = true, default-features = false }
netmodel = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
net-runtime = { workspace = true, default-features = false, features = ["mock"] }
tempfile = { workspace = true }
