[package]
name = "provisiond"
edition.workspace = true
version.workspace = true

[dependencies]
# Asynchronous
tokio = { workspace = true, features = ["fs"] }
tokio-stream = { workspace = true }

# Encoding
base64ct = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
prost = { workspace = true }

# Cryptography
ring = { workspace = true }
x509-cert = { workspace = true }
uuid = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Filesystem
gptman = { workspace = true }
fatfs = { workspace = true }
tempfile = { workspace = true }

# gRPC
tonic = { workspace = true }
tonic-prost = { workspace = true }

# Internal
btrfs = { workspace = true }
granola = { workspace = true }
imager = { workspace = true }
kmsg = { workspace = true }
luks2 = { workspace = true }
pki = { workspace = true }
config = { workspace = true }
ramune = { workspace = true }
sbolt = { workspace = true }
tpm2 = { workspace = true }
yuki = { workspace = true }
zeroize = { workspace = true }

# System/platform APIs
rustix = { workspace = true, features = ["process", "system", "net"] }
libc = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
protox = { workspace = true }

[lints]
workspace = true
