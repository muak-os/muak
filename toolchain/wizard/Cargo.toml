[package]
name = "wizard"
description = "Deterministic image build pipeline"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "wizard"
required-features = ["cli"]

[dependencies]
# Compression
flate2 = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }

# Cryptography
sha2 = { workspace = true }

# CLI
clap = { workspace = true, optional = true }

# Encoding
serde = { workspace = true }
disk = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
anyhow = { workspace = true, optional = true }
thiserror = { workspace = true }

# Internal
kata = { workspace = true, default-features = false }
mumi = { workspace = true }
esp = { workspace = true }
koci = { workspace = true, features = ["pull"] }
miso = { workspace = true}
ramune = { workspace = true }
sbolt = { workspace = true, features = ["linux"] }
tui = { workspace = true, optional = true, features = ["live", "size"] }
uki = { workspace = true }
yuki = { workspace = true }

[features]
default = ["cli"]
cli = ["anyhow", "clap", "dep:tui"]

[dev-dependencies]
object = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
